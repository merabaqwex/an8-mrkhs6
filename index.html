<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111317">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Min-Max">
<title>Min-Max</title>
<style>
:root{
  --bg:#111317; --card:#1b1f26; --card2:#232830; --line:#2e343d;
  --ink:#ecebe6; --mute:#8d94a0; --amber:#f0b241; --green:#3fb66a; --red:#e0584f; --blue:#4aa3df;
  --input:#0d0f12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:16px}
body{padding-bottom:120px}
h1,h2,h3,.disp{font-family:"Avenir Next Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
.top{position:sticky;top:0;z-index:5;background:rgba(17,19,23,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;flex:1}
.top .sub{font-size:12px;color:var(--mute);font-weight:400;display:block;font-family:-apple-system,system-ui}
.ib{background:none;border:0;color:var(--ink);font-size:22px;padding:6px 8px;border-radius:8px}
.ib:active{background:var(--card2)}
main{padding:12px 14px}
.weekh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.weekh b{color:var(--ink);font-size:14px}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--card2);color:var(--amber);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row.done{border-color:rgba(63,182,106,.6);background:linear-gradient(90deg,rgba(63,182,106,.18),var(--card) 60%)}
.row .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#0b0f0c}
.row.done .chk{background:var(--green);border-color:var(--green)}
.row .nm{flex:1}
.row .nm .t{font-size:17px;font-weight:600}
.row .nm .d{font-size:12px;color:var(--mute);margin-top:2px}
.row .nm .d .ok{color:var(--green)}
.row .arrow{color:var(--mute)}
.stat{display:flex;gap:10px;margin:4px 0 6px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-family:"Avenir Next Condensed",system-ui;font-weight:700}
.stat .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.bar{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green)}
/* diyet */
.note{font-size:13px;line-height:1.35;padding:9px 12px;border-radius:8px;margin-bottom:8px;background:var(--card2);border-left:3px solid var(--mute)}
.note.amber{border-left-color:var(--amber)} .note.red{border-left-color:var(--red)} .note.blue{border-left-color:var(--blue)} .note.green{border-left-color:var(--green)}
.sc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sc .h{font-family:"Avenir Next Condensed",system-ui;font-size:19px;font-weight:700}
.sc .m{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.4}
.sc.green{border-left-color:var(--green)} .sc.green .h{color:var(--green)}
.sc.amber{border-left-color:var(--amber)} .sc.amber .h{color:var(--amber)}
.sc.red{border-left-color:var(--red)} .sc.red .h{color:var(--red)}
.sc.blue{border-left-color:var(--blue)} .sc.blue .h{color:var(--blue)}
/* session */
.banner{background:var(--card2);border-left:3px solid var(--amber);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;color:var(--ink)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.ex .num{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
select.exsel{width:100%;margin-top:4px;font-size:18px;font-weight:700;background:transparent;color:var(--ink);border:0;border-bottom:1px dashed var(--line);padding:4px 0;font-family:"Avenir Next Condensed",system-ui;appearance:none;-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;background:var(--card2);padding:4px 8px;border-radius:6px;color:var(--mute)}
.chip b{color:var(--ink);font-weight:600}
.chip.tech{color:var(--amber);border:1px solid rgba(240,178,65,.4);background:transparent}
.hint{font-size:13px;margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--input);border:1px solid var(--line)}
.hint .k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.hint.s{border-color:rgba(240,178,65,.45)}
.hint.s .v{color:var(--amber);font-weight:700;font-size:16px}
.wu{display:flex;gap:6px;flex-wrap:wrap}
.wu span{background:var(--card2);padding:4px 8px;border-radius:6px;font-size:13px}
.wu span b{color:var(--amber)}
.sets{margin-top:8px}
.set{display:grid;grid-template-columns:52px 1fr 1fr 48px;gap:8px;align-items:center;margin-bottom:8px}
.set .lab{font-size:12px;color:var(--mute)}
.set .lab b{display:block;color:var(--ink);font-size:14px}
input[type=number],input[type=date],input[type=text]{width:100%;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 8px;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--amber)}
.set .rir{font-size:12px;color:var(--mute);text-align:center}
.set .rir b{display:block;color:var(--ink);font-size:15px}
.exfoot{display:flex;gap:8px;margin-top:6px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);background:var(--card2)}
.btn.am{background:var(--amber);color:#1a1200}
.btn.gr{background:var(--green);color:#06150b}
.btn.rd{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:active{filter:brightness(.85)}
.btn.full{width:100%;padding:14px;font-size:17px}
details summary{color:var(--mute);font-size:13px;cursor:pointer;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details p{font-size:13px;margin:4px 0 0;color:var(--ink);line-height:1.4}
.donebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.donebox.on{border-color:var(--green)}
.donebox label{font-size:12px;color:var(--mute);display:block;margin-bottom:6px}
/* timer */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#0b0d10;border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:none;align-items:center;gap:10px}
#timer.on{display:flex}
#timer .tm{font-family:"Avenir Next Condensed",system-ui;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px;line-height:1}
#timer .tm.fin{color:var(--green)}
#timer .lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#timer .ring{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
#timer .ring i{display:block;height:100%;background:var(--amber);width:100%}
#timer .ctl{display:flex;gap:6px}
#timer .ctl button{background:var(--card2);color:var(--ink);border:0;border-radius:8px;width:44px;height:40px;font-size:15px;font-weight:600}
/* settings */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.fld input{text-align:left}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:14px}
.days button.on{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700}
.sm{font-size:12px;color:var(--mute);line-height:1.4}
.hid{display:none}
.cbs{display:flex;flex-direction:column;gap:8px}
.cb{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.cb.on{border-color:var(--green)}
.cb .sq{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#06150b;font-weight:700;flex-shrink:0}
.cb.on .sq{background:var(--green);border-color:var(--green)}
.mrow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px}
.mrow .l{color:var(--ink)}
.mrow .v{color:var(--mute)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid div span{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt th{text-align:left;color:var(--mute);font-weight:600;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
table.rt td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.rt tr:last-child td{border-bottom:0}
/* menu */
#menu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none}
#menu.on{display:block}
#menu .panel{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:14px;left:14px;max-width:280px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#menu .item{padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#menu .item:last-child{border-bottom:0}
#menu .item:active{background:var(--card2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer">
  <div><div class="lbl" id="tlbl">Dinlenme</div><div class="tm" id="tm">0:00</div></div>
  <div class="ring"><i id="tring"></i></div>
  <div class="ctl">
    <button onclick="T.adj(-15)">−15</button>
    <button onclick="T.adj(15)">+15</button>
    <button onclick="T.toggle()" id="tpp">II</button>
    <button onclick="T.stop()">✕</button>
  </div>
</div>
<div id="menu" onclick="if(event.target===this) M.close()">
  <div class="panel">
    <div class="item" onclick="M.go('home')">🏠 Antrenmanlar</div>
    <div class="item" onclick="M.go('diet')">🎯 Diyet</div>
    <div class="item" onclick="M.go('progress')">📈 İlerleme</div>
    <div class="item" onclick="M.go('rules')">ⓘ Kurallar</div>
    <div class="item" onclick="M.go('set')">⚙︎ Ayarlar</div>
  </div>
</div>
<script>
/* ============ PROGRAM ============ */
// warm: Jeff's warm-up set range string; sets; range [lo,hi] or null(time); rirI=intro/deload weeks, rirN=normal; tech=block2 technique; rest seconds; type c=compound i=isolation
const DAYS = [
 {name:"Full", ex:[
 {n:"Cable Crunch",blk:"1",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Crunch yaparken belini yuvarla, karınla zihin-kas bağlantısı."},
 {n:"Seated Smith Machine Shoulder Press",ang:"85° sırt",blk:"2a",a:[],warm:"1-2",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:240,t:"c",note:"Ön delt: yükün en ağır olduğu bölge omuz hizasının altında olsun (koltukta kalçayı biraz öne kaydır, 90° altı). Sırtın dik, dirsekler en az 90° kırılsın. Smith'in sabit yörüngesi güvenli overload sağlar, tam kilitlemeden kontrollü indir."},
 {n:"Incline DB Curl",ds:1,ang:"50° bench",blk:"2b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Bench 50°, kollar gövdenin arkasında aşağı sarkar (uzamış pozisyon). Dirsekler sabit, omuz öne kaymasın. Altta tam esneme, kontrollü kaldır."},
 {n:"High-Cable Lateral Raise",blk:"3a",a:[],cuff:1,warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Makara en altta/kalça hizasında, kabloya yan dur, uzak kolla çek. Alttan başlayınca da gerilim var (uzun kas boyu). Bilek cuff'ı kullanabilirsin. Dirsek hafif bükülü, omuz hizasına kadar kaldır, sallanma yok. Her iki kolda aynı tekrar, zayıf kolla başla."},
 {n:"Preacher Curl",ds:1,ang:"60° sehpa",blk:"3b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:"2 Drop Set (~%25)",rest:90,t:"i",note:"Preacher (scott) sehpasına yasla, supine (avuç yukarı) tutuş, kontrollü tekrar. Sehpa sayesinde drop set'te de form bozulmaz."},
 {n:"Seated Smith Machine Incline Press",ang:"30° bench",blk:"4a",a:[],warm:"1-2",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:240,t:"c",note:"Üst göğüs: bench 30°, omuz genişliğinde (dar) tutuş, bar dirseklerin tam üstünde. Tucked kol yolu, altta 1 sn dur, kontrollü it."},
 {n:"Keenan Flap (Frontal Pullover)",blk:"4b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Kablo flap: kollar yana açık, omuz hizasından başla, dirsekler hafif bükük. Kolu gövdeye doğru çek (shoulder adduction), en altta kol gövdeye yapışık ve sıkıştırılmış olsun. Skapulayı aşağı bastır. Yük en çok kol gövdeye yakınken olsun. İlk haftalar hafif başla (pec gerginliği riski)."},
 {n:"Dumbbell Pullover",ang:"0° düz bench",blk:"8b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:120,t:"i",note:"Bench'e sırtüstü, tek dumbbell iki elle. Kollar başın üstünde (180°) başlar, omuz hizasına kadar in-çık. Üst yarı hareket: alt göğüs + triceps uzun baş. Dirsekler hafif bükülü, sabit."},
 {n:"Straight-Arm Cable Pullover (Sagittal)",ang:"gövde hafif öne eğik",blk:"5b",a:[],warm:"1-2",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Lat için sagittal düzlem (shoulder extension). Yüksek makara, kollar düz/hafif bükük, başın üstünden başla, kolu kalçaya doğru çek. Skapulayı aşağı bastır (depression), belini yuvarlama. Altta lat'ı sık, kontrollü geri çık."},
 {n:"Single-Arm Overhead Cable Triceps Ext.",ds:1,blk:"5a",a:[],cuff:1,warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Negatif boyunca triceps'te derin esneme."},
 {n:"Single-Arm Triceps Pressdown",ds:1,blk:"6a",a:[],cuff:1,warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"TEK KOL. Tek tutamak/halatla, üst kol gövdenin yanında-önünde sabit, sadece ön koldan hareket et. Her iki kolda aynı tekrar, zayıf kolla başla."},
 {n:"Leg Extension",ds:1,blk:"6b",a:[],warm:"1-2",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:"Lengthened Partials",rest:90,t:"i",note:"Koltuğu geriye al, tutamakları kavrayıp kalçanı koltuğa bastır."},
 {n:"Pec Deck",blk:"7a",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Sırtını yasla, dirsekler göğüs hizasında. Açılırken pec'te derin esneme, kapanırken göğsü sık."},
 {n:"Single-Arm Reverse Pec Deck",blk:"7b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Tek kol, göğüs destekli. Dirsek hafif bükük, kolu yana aç, kürek kemiklerini aşırı sıkıştırma; omuz arkasında hisset. Kontrollü dön."},
 {n:"Lying Leg Curl",blk:"8a",a:[],warm:"1-2",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:"Lengthened Partials",rest:90,t:"i",note:"Makineyi altta en büyük esnemeyi alacak şekilde ayarla. Kalçanın kalkmasına izin verme."},
 {n:"Kelso Shrug (Chest-Supported)",ang:"45° bench, yüzüstü",blk:"9a",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Orta trapez ve rhomboid için yatay shrug. Göğsün destekli bench'te, kollar aşağı sarkar. Dirsekleri bükmeden sadece kürek kemiklerini birbirine yaklaştır, üstte sık, kontrollü indir. Omuzları kulağa kaldırma."},
 {n:"Seated Hip Abduction (Leaning Forward)",ang:"gövde öne eğik",blk:"9b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Makinede otur, gövdeni öne eğ (kalça fleksiyonda): üst glute max ve glute medius. Yavaş aç, dışta 1 sn sık, kontrollü kapat."},
 {n:"Neck Extension",blk:"10a",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Boyun ekstansiyonu: hafif yükle (plate/harness/makine), yavaş ve kontrollü. Ani hareket yok, tam ROM, boynu zorlama (ağrı varsa bırak)."},
 {n:"Neck Flexion",blk:"10b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Boyun fleksiyonu: hafif yükle (plate/harness/makine), çeneyi göğse doğru yavaş çek. Ani hareket yok, tam ROM, ağrı varsa bırak."},
 {n:"Cable Wrist Curl",blk:"11a",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Ön kol fleksörleri: ön kolu bench veya dize yasla, bilek avuç yukarı. Akıcı ve kontrollü, altta tam esneme, üstte sık."},
 {n:"Cable Reverse Curl",blk:"11b",a:[],warm:"0-1",sets:1,r:[5,9],rirI:[1],rirN:[1],tech:null,rest:90,t:"i",note:"Üst yarı reverse curl (brachioradialis): pronasyon (avuç aşağı) tutuşla, dirsek kıvrımının üst yarısında çalış, bilekler düz."},
 ]},
];
// warm-up set count as Baran decided
const WCOUNT = {"0-1":1,"1-2":1,"2-3":1,"2-4":1,"3-4":1};
// Jeff's percentage/rep table
const WTABLE = {
 1:[[60,"6-10"]],
 2:[[50,"6-10"],[70,"4-6"]],
 3:[[45,"6-10"],[65,"4-6"],[85,"3-4"]],
 4:[[45,"6-10"],[60,"4-6"],[75,"3-5"],[85,"2-4"]],
};
const TECH_EXPL = {
 "Lengthened Partials":"Tam ROM ile başarısız olunca esneme pozisyonunda kısmi tekrarlarla devam et.",
 "2 Drop Set (~%25)":"Başarısız olunca ağırlığı ~%25 düşür, tekrar başarısızlığa git; bir kez daha tekrarla.",
 "Myo-reps":"Başarısız olunca 5 sn dinlen + 2 tekrar; 2 tam tekrar yapamayana kadar döngüyü sürdür.",
 "Static Hold 30 sn":"Başarısız olunca alt (esneme) pozisyonu tam gerginlikle 30 sn tut.",
};

/* ============ DİYET PLANI ============ */
// Hedef: 27 Haz 2027'ye kadar ~%12 yağ. Başlangıç 86.5 kg, ~%30 (tahmini), bakım ~2600 kcal.
const DIET={
 start:"2026-11-16", end:"2027-06-27",
 phases:[
  {from:"2026-11-16",to:"2027-02-07",name:"Faz 1",kcal:2050,p:170,f:"45",c:240,steps:"10k",goal:"%30 → ~%21",rate:"0.7–0.9 kg/hf"},
  {from:"2027-02-08",to:"2027-02-14",name:"Diyet arası",kcal:2550,p:170,f:"45–55",c:350,steps:"serbest",brk:true,goal:"bakım",rate:"—"},
  {from:"2027-02-15",to:"2027-04-18",name:"Faz 2",kcal:1950,p:170,f:"45",c:215,steps:"10k",goal:"~%21 → ~%16",rate:"0.5–0.6 kg/hf"},
  {from:"2027-04-19",to:"2027-04-25",name:"Diyet arası",kcal:2450,p:170,f:"45–55",c:330,steps:"serbest",brk:true,goal:"bakım",rate:"—"},

 ],
 // hedef kilo çizgisi (7 günlük ortalama), aradaki günler doğrusal

const WDS=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];

const KEY="minmax_v1";
const iso = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = ()=>iso(new Date());
function defaultTargets(){ return {train:{kcal:2550,protein:170,carb:300,fat:75},rest:{kcal:2435,protein:170,carb:270,fat:75}}; }
function ensureCfg(){
  S.cfg = S.cfg || {};
  if(S.cfg.weeks==null) S.cfg.weeks=20;
  if(S.cfg.incC==null) S.cfg.incC=5;

const PER_WEEK=4;
function schedule(){
  const n=Math.max(4,(S.cfg.weeks||20)*4), out=[];
  for(let i=0;i<n;i++) out.push({i, day:i%DAYS.length, week:Math.floor(i/PER_WEEK)+1, pw:1});
  return out;
}
const LAYOUT=`Full body: seçili kas bölgeleri için 1 hareket, 1 set, 5-9 tekrar, RIR 1. Bir gün arayla, haftada 3-4 kez.
Sıralama: karın (en başta), omuz, biceps, göğüs ve sırt, triceps, quad, hamstring, glute, boyun. Boyun en sonda.
Aynı bölgeyi art arda çalıştırıyorsan 3-5 dk dinlen.`;
const fmt = s=>{ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short",weekday:"short"}); };
const fs = s=>{ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"}); };
const isLight = w => w===1||w===7;
const sessData = i => S.sess[i] || (S.sess[i]={done:false,doneDate:"",ex:{}});
const exData = (i,j,E) => { const s=sessData(i); const d=s.ex[E.n]||(s.ex[E.n]={sets:[]}); while(d.sets.length<E.sets) d.sets.push({kg:"",reps:""}); return d; };
const roundTo = (x,q)=>Math.round(x/q)*q;

// suggestion: look back for same slot + same set index, independent per set
function suggest(i,j,k,E){
  if(!E.r) return null;
  const sched = schedule(), hist=[];
  for(let x=i-1;x>=0 && hist.length<3;x--){
    const sx=sched[x]; if(!sx || sx.day!==i%DAYS.length) continue;
    const d=S.sess[x]&&S.sess[x].ex[E.n]; if(!d) continue;
    const st=d.sets[k]; if(!st||st.kg===""||st.reps==="") continue;
    const kg=parseFloat(st.kg), reps=parseFloat(st.reps); if(isNaN(kg)||isNaN(reps)) continue;
    hist.push({kg,reps});
  }
  if(!hist.length) return null;
  const last=hist[0], prev=hist[1], prev2=hist[2], top=E.r[1], inc = E.t==="c"?S.cfg.incC:S.cfg.incI;
  if(last.reps<E.r[0]){
    // aralığın altında kaldıysa: bir basamak düşür (videodaki küçük reset mantığı)
    const nk=Math.max(0,roundTo(last.kg-inc,S.cfg.round||0.5));
    return {kg:nk, why:`Geçen seans ${last.kg} kg × ${last.reps} – ${E.r[0]} tekrarın altında kaldın, ${inc} kg düşür ve ${top} tekrara çık`, prev:last.kg, prevReps:last.reps};
  }
  if(last.reps>=top){
    // videodaki kural: üst sınıra ilk ulaşma + 2 seans daha aynı kiloda (toplam 3 seans), sonra yük artır
    if(prev && prev2 && prev.reps>=top && prev.kg===last.kg && prev2.reps>=top && prev2.kg===last.kg) return {kg:last.kg+inc, why:`3 seans üst üste ${last.kg} kg × ${top} – hak ettin, +${inc} kg`, prev:last.kg, prevReps:last.reps};
    return {kg:last.kg, why:`Geçen seans ${last.reps} tekrar (üst sınır) – aynı kiloda ${top} tekrarı toplam 3 seans tutturunca artır (${prev&&prev.reps>=top&&prev.kg===last.kg?2:1}/3 tamam)`, prev:last.kg, prevReps:last.reps};
  }
  return {kg:last.kg, why:`Geçen seans ${last.kg} kg × ${last.reps} – aynı kiloyla ${top} tekrarı hedefle`, prev:last.kg, prevReps:last.reps};
}
function warmup(E,work){
  const n=WCOUNT[E.warm]||1; if(!work||!E.r) return {n,list:[]};
  return {n,list:WTABLE[n].map(([p,reps])=>({kg:roundTo(work*p/100,S.cfg.round),p,reps}))};
}

/* ============ DİYET HESAPLARI ============ */
const dD=s=>new Date(s+"T00:00:00");
const dAdd=(s,n)=>{ const d=dD(s); d.setDate(d.getDate()+n); return iso(d); };
const dDiff=(a,b)=>Math.round((dD(b)-dD(a))/864e5); // b − a (gün)
function dPhase(d){ if(d<DIET.start||d>DIET.end) return null; return DIET.phases.find(p=>d>=p.from&&d<=p.to)||null; }
function dTarget(d){
  const L=DIET.line;
  if(d<=L[0][0]) return L[0][1];
  if(d>=L[L.length-1][0]) return L[L.length-1][1];
  for(let k=1;k<L.length;k++){
    if(d<=L[k][0]){ const [d0,v0]=L[k-1], [d1,v1]=L[k]; return v0+(v1-v0)*dDiff(d0,d)/dDiff(d0,d1); }
  }
}
function dBand(d){
  const t=dTarget(d); let hi=t+DIET.hi;
  if(DIET.phases.some(p=>p.brk && d>=p.from && d<=dAdd(p.to,7))) hi+=DIET.brkExtra;
  return {t, lo:t-DIET.lo, hi};
}
// [end-days+1, end] aralığındaki tartıların ortalaması + ortalama tarihi (ortalama gecikmesini düzeltmek için)
function kgAvg(end,days){
  const xs=[];
  for(const d of Object.keys(S.log||{})){
    if(d>end||dDiff(d,end)>=days) continue;
    const v=parseFloat(S.log[d].kg); if(!isNaN(v)) xs.push({d,v});
  }
  if(!xs.length) return {n:0};
  const avg=xs.reduce((a,x)=>a+x.v,0)/xs.length;
  const off=Math.round(xs.reduce((a,x)=>a+dDiff(end,x.d),0)/xs.length);
  return {n:xs.length, avg, md:dAdd(end,off)};
}
function waistTrend(){
  const w=logPts("waist"); if(w.length<2) return null;
  const last=w[w.length-1]; let ref=null;
  for(let k=w.length-2;k>=0;k--){ if(dDiff(w[k].d,last.d)>=10){ ref=w[k]; break; } }
  if(!ref) return null;
  return {last, ref, per2w:(last.v-ref.v)/dDiff(ref.d,last.d)*14};
}
// son tamamlanan seans vs 4 seans öncesi, S1 tahmini 1RM (Epley)
function strengthTrend(){
  const done=Object.keys(S.sess||{}).map(Number).filter(i=>S.sess[i]&&S.sess[i].done).sort((a,b)=>a-b);
  if(done.length<5) return null;
  const A=S.sess[done[done.length-1]], B=S.sess[done[done.length-5]];
  const e1=st=>{ const kg=parseFloat(st&&st.kg), r=parseFloat(st&&st.reps); return (isNaN(kg)||isNaN(r))?null:kg*(1+r/30); };
  let up=0, down=0;
  for(const E of DAYS[0].ex){
    const a=A.ex&&A.ex[E.n]?e1(A.ex[E.n].sets[0]):null, b=B.ex&&B.ex[E.n]?e1(B.ex[E.n].sets[0]):null;
    if(a==null||b==null) continue;
    if(a>b*1.01) up++; else if(a<b*0.99) down++;
  }
  return {up, down, bad:down>up, txt:down>up?"düşüyor":(up?"artıyor":"sabit")};
}
function dStatus(){
  const td=today(), a=kgAvg(td,7);
  if(a.n<3) return {cls:"mute", h:"Veri az", m:`Durum için son 7 günde en az 3 tartı gerekli (şu an ${a.n}).`, a, rate:null};
  const b=dBand(a.md), diff=a.avg-b.t;
  const p=kgAvg(dAdd(td,-7),7);
  const rate=p.n>=3?(p.avg-a.avg)/p.avg*100:null; // haftalık % kayıp
  let cls, h;
  if(a.avg<b.lo){ cls="green"; h="Hedefin önündesin"; }
  else if(a.avg<=b.t+DIET.lo){ cls="green"; h="Aralıktasın"; }
  else if(a.avg<=b.hi){ cls="amber"; h="Sınırdasın"; }
  else { cls="red"; h="Aralık dışı (geride)"; }
  const ph=dPhase(td);
  if(rate!=null && rate>1.0 && !(ph&&ph.brk)){ cls="blue"; h="Fazla hızlısın"; }
  const m=`${a.avg.toFixed(1)} kg (7 gün ort.) · hedef ${b.t.toFixed(1)} (${b.lo.toFixed(1)}–${b.hi.toFixed(1)}) · fark ${diff>0?"+":""}${diff.toFixed(1)} kg`;
  return {cls, h, m, a, b, rate, diff};
}
function dDecide(st){
  const td=today(), ph=dPhase(td);
  if(!ph) return {cls:"mute", h:td<DIET.start?"Plan başlamadı":"Plan bitti", m:td<DIET.start?`Başlangıç: ${fmt(DIET.start)}. Bu arada her sabah tartılmaya başla, ilk bel ölçümünü al.`:"Hedef tarihe ulaşıldı."};
  if(ph.brk) return {cls:"green", h:"Diyet arası: bakımda ye", m:"Tartıda +0.5–1.5 kg su/glikojen artışı normal. Bu hafta karar yok."};
  if(st.cls==="mute") return {cls:"mute", h:"Karar için veri bekleniyor", m:st.m};
  const w=waistTrend(), g=strengthTrend();
  const wDown=!!(w&&w.per2w<=-0.5), gBad=!!(g&&g.bad);
  if(st.rate!=null && st.rate>1.0) return {cls:"blue", h:"+100–150 kcal", m:`Son haftalarda haftalık %${st.rate.toFixed(1)} kayıp, %1'in üstünde. Kas kaybı riski.`};
  if(st.cls==="green") return {cls:"green", h:"Dokunma", m:"Kilo aralıkta, plana devam."};
  if(st.cls==="amber") return wDown
    ? {cls:"green", h:"Dokunma", m:"Kilo sınırda ama bel düşüyor."}
    : {cls:"amber", h:"Gözle", m:"Kilo sınırda, bel düşmüyor. Bir sonraki karar gününde de böyleyse −150 kcal."};
  if(!w) return {cls:"amber", h:"Bel ölçümü gerekli", m:"Kilo geride. Karar için en az 10 gün arayla iki bel ölçümü lazım."};
  if(wDown && !gBad) return {cls:"green", h:"Recomp: dokunma", m:"Kilo geride ama bel düşüyor ve güç korunuyor: yağ gidiyor, kas geliyor."};
  return {cls:"red", h:"−150 kcal veya +2000 adım", m:wDown?"Bel düşüyor ama güç de düşüyor: açığı yemekten değil adımdan büyüt.":"Kilo geride ve bel durmuş."};
}
function nextDecision(){
  const td=today();
  if(td<=DIET.start) return dAdd(DIET.start,14);
  let k=Math.ceil(dDiff(DIET.start,td)/14)*14; if(k===0) k=14;
  return dAdd(DIET.start,k);
}
function dRem(){
  const td=today(), out=[], e=(S.log||{})[td]||{}, adj=S.cfg.kcalAdj||0;
  if(td<DIET.start) out.push({cls:"amber", t:`Diyet planı ${fmt(DIET.start)} başlıyor (Faz 1: ${DIET.phases[0].kcal+adj} kcal).`});
  if(td>DIET.end) return out;
  if(e.kg===undefined||e.kg===""||e.kg===null) out.push({cls:"amber", t:"Bugünün kilosu girilmedi."});
  const wd=S.cfg.waistDay, back=(dD(td).getDay()-wd+7)%7, lastW=dAdd(td,-back);
  const hasW=Object.keys(S.log||{}).some(d=>d>=lastW&&d<=td&&S.log[d].waist!==""&&S.log[d].waist!=null);
  if(!hasW && !(back && td<DIET.start)) out.push(back
    ? {cls:"red", t:`Bel ölçümü ${back} gün gecikti (${WD[wd]} ölçülecekti).`}
    : {cls:"amber", t:"Bugün bel ölçüm günü: sabah, aç karnına, tuvaletten sonra, nefes verirken, hep aynı noktadan."});
  if(td>=DIET.start && dDiff(DIET.start,td)%14===0) out.push({cls:"amber", t:"Fotoğraf günü: aynı ışık, aynı poz (ön, yan, arka)."});
  if(td>DIET.start && dDiff(DIET.start,td)%14===0) out.push({cls:"blue", t:"Bugün 2 haftalık değerlendirme günü: Diyet sayfasındaki karara bak."});
  const cp=DIET.cps.find(c=>c>=td&&dDiff(td,c)<=6);
  if(cp){ const b=dBand(cp); out.push({cls:"blue", t:`${dDiff(td,cp)?"Bu hafta":"Bugün"} kontrol (${fs(cp)}): hedef ${b.t.toFixed(1)} kg (${b.lo.toFixed(1)}–${b.hi.toFixed(1)}).`}); }
  const p0=dPhase(td), p1=dPhase(dAdd(td,1));
  if(p1 && p1!==p0) out.push({cls:"blue", t:`Yarından itibaren ${p1.name}: ${p1.kcal+adj} kcal · ${p1.p}P · ${p1.f}Y · ${p1.c+Math.round(adj/4)}K · ${p1.steps} adım.`});
  return out;
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const p=S.view.page;
  $("#app").innerHTML = p==="home"?home(): p==="sess"?session(S.view.i): p==="diet"?diet(): p==="log"?logpage(): p==="rules"?rules(): p==="progress"?progress(): settings();

}

const M={ open(){ $("#menu").classList.add("on"); }, close(){ $("#menu").classList.remove("on"); }, go(page){ this.close(); go(page); } };

function home(){
  const sched=schedule(); const done=sched.filter(s=>S.sess[s.i]&&S.sess[s.i].done).length;
  const next=sched.find(s=>!(S.sess[s.i]&&S.sess[s.i].done));
  let h=`<div class="top"><h1>Min-Max<span class="sub">${sched.length} antrenman · ${S.cfg.weeks} hafta</span></h1><button class="ib" onclick="M.open()">☰</button></div><main>`;
  h+=dRem().map(r=>`<div class="note ${r.cls}" onclick="go('diet')">${esc(r.t)}</div>`).join("");
  h+=`<div class="stat"><div><div class="n">${done}<span style="color:var(--mute);font-size:14px">/${sched.length}</span></div><div class="l">Tamamlanan</div><div class="bar"><i style="width:${sched.length?done/sched.length*100:0}%"></i></div></div>
  <div onclick="${next?`go('sess',${next.i})`:""}"><div class="n">${next?esc(DAYS[next.day].name):"—"}</div><div class="l">Sıradaki · #${next?next.i+1:""}</div></div></div>`;
  h+=`<details class="banner" style="border-color:var(--line)"><summary>Haftalık düzen önerisi</summary><p style="white-space:pre-line">${esc(LAYOUT)}</p></details>`;
  let lastW=null;
  for(const s of sched){
    const key=s.week;
    if(key!==lastW){ lastW=key; h+=`<div class="weekh"><span><b>Hafta ${s.week}</b></span></div>`; }
    const d=S.sess[s.i]||{};
    h+=`<div class="row ${d.done?"done":""}" onclick="go('sess',${s.i})"><div class="chk">${d.done?"✓":""}</div><div class="nm"><div class="t">${esc(DAYS[s.day].name)}</div><div class="d">#${s.i+1}${d.doneDate?` · <span class="${d.done?"ok":""}">${fmt(d.doneDate)}</span>`:""}${d.durMin!=null?` · ${d.durMin} dk`:""}</div></div><div class="arrow">›</div></div>`;
  }
  return h+`</main>`;
}

function session(i){
  const s=schedule()[i]; if(!s){S.view.page="home";return home();}
  const D=DAYS[s.day], sd=sessData(i), light=false, b2=false;
  let h=`<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>${esc(D.name)}<span class="sub">#${i+1} · Hafta ${s.week}${sd.durMin!=null?` · ${sd.durMin} dk sürdü`:""}</span></h1><button class="ib" onclick="M.open()">☰</button></div><main>`;
  h+=`<div class="hint" style="margin-bottom:10px">${sd.start?`<span class="k">Başlangıç</span>${new Date(sd.start).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}<button class="btn" style="margin-left:10px;padding:4px 10px;font-size:12px" onclick="startWorkout(${i})">Yeniden başlat</button>`:`<button class="btn full" onclick="startWorkout(${i})">▶ Antrenmana Başla</button>`}</div>`;
  D.ex.forEach((E,j)=>{
    const d=exData(i,j,E);
    const rir=light?E.rirI:E.rirN;
    const sugs = d.sets.map((st,k)=>suggest(i,j,k,E));
    const sug0 = sugs[0];
    const sugKg0 = sug0 ? (light?sug0.prev:sug0.kg) : null;
    const work = d.sets[0].kg!==""?parseFloat(d.sets[0].kg):sugKg0;
    const wu=warmup(E,work);
    h+=`<div class="ex"><div class="num">Egzersiz ${j+1}</div><h2 style="font-size:20px;margin:2px 0 4px">${esc(E.n)}</h2>
    <div class="chips">${E.ang?`<span class="chip" style="border-color:var(--green);color:var(--green)">Açı <b>${esc(E.ang)}</b></span>`:""}<span class="chip">Tekrar <b>${E.r?E.r.join("–"):"süre"}</b></span>${E.ds?`<span class="chip" style="border-color:var(--blue);color:var(--blue)">Deadstop</span>`:""}${E.cuff?`<span class="chip" style="border-color:var(--amber);color:var(--amber)">Cuff</span>`:""}${b2&&E.tech?`<span class="chip tech">${esc(E.tech)}</span>`:""}</div>`;
    if(E.r && sugs.some(sg=>sg)) h+=`<div class="hint s"><span class="k">Öneri${light?" (hafif hafta)":""} — set başına</span>${sugs.map((sg,k)=>{
      if(!sg) return `<div style="margin-top:4px;font-size:13px">Set ${k+1}: <span style="color:var(--mute)">ilk seans</span></div>`;
      const sk=light?sg.prev:sg.kg;
      return `<div style="margin-top:4px;font-size:13px">Set ${k+1}: <b style="color:var(--amber)">${sk} kg</b> <span style="color:var(--mute)">· ${esc(light?`geçen ${sg.prev} kg × ${sg.prevReps}`:sg.why)}</span></div>`;
    }).join("")}</div>`;
    else if(E.r) h+=`<div class="hint"><span class="k">Öneri</span>İlk seans – kiloyu kendin belirle, sonraki seansta öneri çıkar.</div>`;
    h+=`<div class="sets">`;
    d.sets.forEach((st,k)=>{
      const sg=sugs[k]; const sk=sg?(light?sg.prev:sg.kg):null;
      h+=`<div class="set"><div class="lab">Set<b>${k+1}</b></div><input type="number" inputmode="decimal" step="0.5" placeholder="${E.r?(sk??"kg"):"—"}" value="${esc(st.kg)}" onchange="setv(${i},${j},${k},'kg',this.value)">
      <input type="number" inputmode="numeric" placeholder="${E.r?"tekrar":"sn"}" value="${esc(st.reps)}" onchange="setv(${i},${j},${k},'reps',this.value)"><div class="rir">RIR<b>${rir[k]??"–"}</b></div></div>`;
    });
    h+=`</div>
    <details><summary>Not ${b2&&E.tech?"· teknik":""}</summary><p>${esc(E.note)}</p>${b2&&E.tech?`<p style="color:var(--amber)">${esc(E.tech)}: ${esc(TECH_EXPL[E.tech]||"")}</p>`:""}</details></div>`;
  });
  h+=`<div class="donebox ${sd.done?"on":""}"><label>Antrenman tarihi (sen gir)</label><input type="date" value="${esc(sd.doneDate||"")}" onchange="sessData(${i}).doneDate=this.value;save()">
  <div style="height:10px"></div><button class="btn full ${sd.done?"":"gr"}" onclick="toggleDone(${i})">${sd.done?"Tamamlandı ✓ (geri al)":"Antrenmanı tamamla"}</button></div>

  return h;
}

function diet(){
  const td=today(), adj=S.cfg.kcalAdj||0, ld=S.view.dd||td, e=(S.log||{})[ld]||{};
  const ph=dPhase(td) || (td<DIET.start?DIET.phases[0]:null);
  const st=dStatus(), dc=dDecide(st), inPlan=td>=DIET.start&&td<=DIET.end;
  let h=`<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>Diyet<span class="sub">${ph?esc(ph.name):"Plan bitti"}${inPlan?` · Hafta ${Math.floor(dDiff(DIET.start,td)/7)+1}/32`:""}</span></h1><button class="ib" onclick="M.open()">☰</button></div><main>`;
  h+=dRem().map(r=>`<div class="note ${r.cls}">${esc(r.t)}</div>`).join("");

  // giriş
  h+=`<div class="weekh"><span><b>${ld===td?"Bugün":"Geçmiş gün"}</b></span>${ld!==td?`<span class="tag" onclick="S.view.dd='';save();render()">Bugüne dön</span>`:""}</div>
  <div class="fld" style="margin-bottom:8px"><input type="date" value="${ld}" max="${td}" onchange="S.view.dd=this.value;save();render()"></div>
  <div class="tgrid"><div><span>Kilo (kg)</span><input type="number" inputmode="decimal" step="0.1" value="${esc(e.kg??"")}" onchange="logset('${ld}','kg',this.value)"></div>
  <div><span>Bel (cm) · ${WD[S.cfg.waistDay]}</span><input type="number" inputmode="decimal" step="0.5" value="${esc(e.waist??"")}" onchange="logset('${ld}','waist',this.value)"></div></div>
  <p class="sm" style="margin-top:6px">Bel: sabah, aç karnına, tuvaletten sonra, ayakta, nefes verirken, hep aynı noktadan (en kalın yer, senin için alt karın).</p>`;

  // hedef
  if(ph){
    h+=`<div class="weekh"><span><b>Günlük hedef</b></span><span class="tag">${esc(ph.name)}${td<DIET.start?" (başlayınca)":""}</span></div>
    <div class="stat"><div><div class="n">${ph.kcal+adj}</div><div class="l">kcal</div></div><div><div class="n">${ph.p}</div><div class="l">Protein g</div></div><div><div class="n">${ph.f}</div><div class="l">Yağ g</div></div></div>
    <div class="stat"><div><div class="n">${ph.c+Math.round(adj/4)}</div><div class="l">Karb g</div></div><div><div class="n">${ph.steps}</div><div class="l">Adım</div></div></div>`;
    if(adj) h+=`<p class="sm">Kalori düzeltmesi uygulanıyor: ${adj>0?"+":""}${adj} kcal (karbonhidrata yansıtıldı). Ayarlar'dan değiştir.</p>`;
  }

  // durum
  h+=`<div class="weekh"><span><b>Durum</b></span></div>
  <div class="sc ${st.cls}"><div class="h">${esc(st.h)}</div><div class="m">${esc(st.m)}</div>${st.rate!=null?`<div class="m">Son hafta: haftalık %${st.rate.toFixed(2)} kayıp</div>`:""}</div>`;

  // sonraki kontrol
  const ncp=DIET.cps.find(c=>c>=td);
  if(ncp){
    const b=dBand(ncp), dl=dDiff(td,ncp);
    const need=(st.a&&st.a.n>=3&&dl>0)?(st.a.avg-b.t)/(dl/7):null;
    h+=`<div class="sc blue"><div class="h">Sonraki kontrol: ${fs(ncp)} · ${dl?dl+" gün":"bugün"}</div><div class="m">Hedef ${b.t.toFixed(1)} kg (${b.lo.toFixed(1)}–${b.hi.toFixed(1)})${need!=null?(need>0?` · bunun için haftada ${need.toFixed(2)} kg`:" · zaten hedefin altındasın"):""}</div></div>`;
  }

  // karar
  const w=waistTrend(), g=strengthTrend();
  h+=`<div class="weekh"><span><b>2 haftalık karar</b></span><span class="tag">Karar günü: ${fs(nextDecision())}</span></div>
  <div class="sc ${dc.cls}"><div class="h">${esc(dc.h)}</div><div class="m">${esc(dc.m)}</div>
  <div class="m" style="margin-top:6px">Bel: ${w?`${w.per2w>0?"+":""}${w.per2w.toFixed(1)} cm / 2 hafta`:"yetersiz veri"} · Güç: ${g?`${g.txt} (${g.up}↑ ${g.down}↓)`:"yetersiz veri"}</div></div>
  <p class="sm">Değişikliği sadece karar gününde uygula; arada görünen öneri bilgi amaçlı. "−150 kcal" çıkarsa Ayarlar → Kalori düzeltmesi.</p>`;

  // grafik
  h+=`<div class="weekh"><span><b>Kilo vs hedef</b></span></div><div class="ex">${dietChart()}</div>`;

  // kontrol noktaları
  h+=`<div class="weekh"><span><b>Kontrol noktaları</b></span></div><table class="rt"><tr><th>Tarih</th><th>Hedef</th><th>Aralık</th><th>Gerçek</th></tr>${DIET.cps.map(c=>{
    const b=dBand(c); let r="–";
    if(c<=td){ const a=kgAvg(c,7); if(a.n>=3){ const col=a.avg>b.hi?"var(--red)":a.avg<b.lo?"var(--blue)":"var(--green)"; r=`<b style="color:${col}">${a.avg.toFixed(1)}</b>`; } }
    return `<tr><td>${fs(c)}</td><td>${b.t.toFixed(1)}</td><td>${b.lo.toFixed(1)}–${b.hi.toFixed(1)}</td><td>${r}</td></tr>`;
  }).join("")}</table>`;

  // fazlar
  h+=`<div class="weekh"><span><b>Fazlar</b></span></div><table class="rt"><tr><th>Faz</th><th>Tarih</th><th>kcal</th><th>P/Y/K</th></tr>${DIET.phases.map(p=>`<tr style="${p===ph?"color:var(--amber)":""}"><td>${esc(p.name)}</td><td>${fs(p.from)} – ${fs(p.to)}</td><td>${p.kcal}</td><td>${p.p}/${p.f}/${p.c}</td></tr>`).join("")}</table>`;

  // takviye (seçili gün)
  const sp=e.sup||{}, nSup=SUPS.filter(([k])=>sp[k]).length;
  h+=`<div class="weekh"><span><b>Takviyeler</b> · ${ld===td?"bugün":fs(ld)}</span><span class="tag">${nSup}/${SUPS.length}</span></div><div class="cbs">${SUPS.map(([k,l])=>`<label class="cb ${sp[k]?"on":""}" onclick="logsup('${ld}','${k}')"><span class="sq">${sp[k]?"✓":""}</span>${l}</label>`).join("")}</div>`;

  // geçmiş kayıtlar
  const dates=Object.keys(S.log||{}).filter(x=>{const r=S.log[x]; return (r.kg!==""&&r.kg!=null)||(r.waist!==""&&r.waist!=null)||(r.sup&&Object.values(r.sup).some(Boolean));}).sort().reverse();
  h+=`<details style="margin-top:14px"><summary>Geçmiş kayıtlar (${dates.length}) — düzeltmek için dokun</summary><div style="margin-top:8px">${dates.map(x=>{ const r=S.log[x]; const sup=SUPS.filter(([k])=>r.sup&&r.sup[k]).map(([k,l])=>l.split(" ")[0]).join(" · ");
    return `<div class="row" onclick="S.view.dd='${x}';save();render()"><div class="nm"><div class="t">${fmt(x)}${r.kg!==""&&r.kg!=null?` · <span style="color:var(--amber)">${r.kg} kg</span>`:""}${r.waist!==""&&r.waist!=null?` · <span style="color:var(--blue)">${r.waist} cm</span>`:""}</div><div class="d">${sup}</div></div><div class="arrow">›</div></div>`; }).join("")||`<p class="sm">Henüz kayıt yok.</p>`}</div></details>`;
  return h+`</main>`;
}
function dietChart(){
  const W=340,H=210,pL=30,pR=8,pT=10,pB=22, s=DIET.start, e=DIET.end;
  const kp=logPts("kg").filter(p=>p.d>=dAdd(s,-14)&&p.d<=e);
  const x0=kp.length&&kp[0].d<s?kp[0].d:s, span=dDiff(x0,e);
  const X=d=>pL+dDiff(x0,d)/span*(W-pL-pR);
  const samp=[]; for(let k=0;k<=dDiff(s,e);k+=2) samp.push(dAdd(s,k)); if(samp[samp.length-1]!==e) samp.push(e);
  const bands=samp.map(d=>Object.assign({d},dBand(d)));
  let yMin=Math.min(...bands.map(b=>b.lo),...kp.map(p=>p.v)), yMax=Math.max(...bands.map(b=>b.hi),...kp.map(p=>p.v));
  yMin=Math.floor(yMin-0.5); yMax=Math.ceil(yMax+0.5);
  const Y=v=>pT+(1-(v-yMin)/(yMax-yMin))*(H-pT-pB);
  const P=(d,v)=>`${X(d).toFixed(1)},${Y(v).toFixed(1)}`;
  const poly=bands.map(b=>P(b.d,b.hi)).concat(bands.slice().reverse().map(b=>P(b.d,b.lo))).join(" ");
  const tl=bands.map((b,k)=>`${k?"L":"M"}${P(b.d,b.t)}`).join(" ");
  const dots=kp.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="1.8" style="fill:var(--mute)"/>`).join("");
  const av=kp.map(p=>{ const a=kgAvg(p.d,7); return a.n>=2?{d:p.d,v:a.avg}:null; }).filter(Boolean);
  const al=av.map((p,k)=>`${k?"L":"M"}${P(p.d,p.v)}`).join(" ");
  const cps=DIET.cps.map(c=>`<circle cx="${X(c).toFixed(1)}" cy="${Y(dTarget(c)).toFixed(1)}" r="3" style="fill:var(--bg);stroke:var(--ink)" stroke-width="1.2"/>`).join("");
  let grid=""; for(let v=Math.ceil(yMin/2)*2; v<=yMax; v+=2) grid+=`<line x1="${pL}" x2="${W-pR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line)" stroke-width=".5"/><text x="${pL-4}" y="${(Y(v)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${v}</text>`;
  let ml=""; const m=dD(x0); m.setDate(1); m.setMonth(m.getMonth()+1);
  while(iso(m)<=e){ const d=iso(m); ml+=`<line x1="${X(d).toFixed(1)}" x2="${X(d).toFixed(1)}" y1="${H-pB}" y2="${H-pB+3}" style="stroke:var(--line)"/><text x="${X(d).toFixed(1)}" y="${H-8}" font-size="9" style="fill:var(--mute)" text-anchor="middle">${m.toLocaleDateString("tr-TR",{month:"short"})}</text>`; m.setMonth(m.getMonth()+1); }
  const td=today(), tdl=(td>=x0&&td<=e)?`<line x1="${X(td).toFixed(1)}" x2="${X(td).toFixed(1)}" y1="${pT}" y2="${H-pB}" style="stroke:var(--amber)" stroke-dasharray="2 3"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}
  <polygon points="${poly}" style="fill:rgba(63,182,106,.13)"/>
  <path d="${tl}" fill="none" style="stroke:var(--green)" stroke-width="1.2" stroke-dasharray="4 3"/>
  ${tdl}${dots}${al?`<path d="${al}" fill="none" style="stroke:var(--amber)" stroke-width="2" stroke-linejoin="round"/>`:""}${cps}
  <line x1="${pL}" y1="${H-pB}" x2="${W-pR}" y2="${H-pB}" style="stroke:var(--line)"/>${ml}</svg>
  <p class="sm" style="margin-top:6px">Yeşil bant: kabul aralığı · kesikli: hedef · turuncu: 7 gün ort. · gri: günlük tartı · ○ kontrol noktası · dikey çizgi: bugün</p>`;
}

const SUPS=[["kre","Kreatin"],["omg","Omega-3"],["mul","Multivitamin"],["pro","Protein"],["sit","Sitrulin Malat"],["mag","Magnezyum"]];
function logpage(){
  S.log=S.log||{}; const d=S.view.ld||today(); const e=logent(d);
  const box=(k,lbl,on,fn)=>`<label class="cb ${on?"on":""}" onclick="${fn}"><span class="sq">${on?"✓":""}</span>${lbl}</label>`;
  let h=`<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>Günlük</h1><button class="ib" onclick="M.open()">☰</button></div><main>
  <div class="fld"><label>Tarih</label><input type="date" value="${d}" onchange="S.view.ld=this.value;save();render()"></div>
  <div class="fld"><label>Kilo (kg)</label><input type="number" inputmode="decimal" step="0.1" value="${esc(e.kg)}" onchange="logset('${d}','kg',this.value)"></div>
  <div class="fld"><label>Bel ölçümü (cm) · ölçüm günü ${WD[S.cfg.waistDay]}</label><input type="number" inputmode="decimal" step="0.5" value="${esc(e.waist)}" onchange="logset('${d}','waist',this.value)">
  <p class="sm">Belinin en kalın olduğu noktadan ölç — bu göbek deliği olmak zorunda değil, senin için alt karın bölgesi olabilir. Tek kural: <b>her hafta aynı noktadan</b> ölç. İlk ölçtüğünde o noktayı sabitle (ör. "göbek deliğinin 3-4 parmak altı" veya "kalça kemiğinin X cm üstü") ve her seferinde oradan ölç. Sabah aç karnına, tuvaletten sonra, ayakta, mezura yere paralel, karnını çekmeden, nefes verirken ölç.</p></div>
`;
  const dates=Object.keys(S.log).sort().reverse();
  const wk=dates.filter(x=>S.log[x].kg!=="").slice(0,7).map(x=>parseFloat(S.log[x].kg)).filter(x=>!isNaN(x));
  if(wk.length) h+=`<div class="hint" style="margin-top:12px"><span class="k">Son ${wk.length} ölçümün kilo ortalaması</span><b>${(wk.reduce((a,b)=>a+b,0)/wk.length).toFixed(1)} kg</b></div>`;
  const waistDates=Object.keys(S.log).filter(x=>S.log[x].waist!==""&&S.log[x].waist!=null).sort();
  if(waistDates.length){
    const first=parseFloat(S.log[waistDates[0]].waist);
    const last=parseFloat(S.log[waistDates[waistDates.length-1]].waist);
    const delta=(last-first).toFixed(1);
    h+=`<div class="hint"><span class="k">Bel çevresi (${fmt(waistDates[0])} → ${fmt(waistDates[waistDates.length-1])})</span><b>${last} cm</b> <span style="color:var(--mute)">(${delta>=0?"+":""}${delta} cm)</span></div>`;
  }
  h+=`<div class="weekh"><span><b>Kayıtlar</b></span></div>`;
  for(const x of dates){ const r=S.log[x]; const sup=SUPS.filter(([k])=>r.sup&&r.sup[k]).map(([k,l])=>l.split(" ")[0]).join(" · ");
    h+=`<div class="row" onclick="S.view.ld='${x}';save();render()"><div class="nm"><div class="t">${fmt(x)} ${r.kg!==""&&r.kg!=null?`· <span style="color:var(--amber)">${r.kg} kg</span>`:""}${r.waist!==""&&r.waist!=null?` · <span style="color:var(--blue)">${r.waist} cm</span>`:""}</div><div class="d">${sup||""}</div></div><div class="arrow">›</div></div>`; }
  if(!dates.length) h+=`<p class="sm">Henüz kayıt yok.</p>`;
  return h+`</main>`;
}
function logent(d){ S.log=S.log||{}; return S.log[d]||(S.log[d]={kg:"",waist:"",kcal:"",protein:"",carb:"",fat:"",antr:false,kardiyo:false,sup:{}}); }
function logset(d,k,v){ logent(d)[k]=v; save(); render(); }
function logsup(d,k){ const e=logent(d); e.sup=e.sup||{}; e.sup[k]=!e.sup[k]; save(); render(); }

   p("En kalın noktadan ölç — göbek deliği zorunlu değil. Senin için alt karın bölgesiyse orası referans noktan.")+
   p("Kritik kural: <b>her zaman aynı noktadan</b> ölç. İlk ölçtüğünde o noktayı not al ve her seferinde oradan ölç.")+
   p("Haftada bir, Ayarlar'da seçtiğin günde (varsayılan Pazartesi). Sabah aç karnına, tuvaletten sonra, ayakta, mezura yere paralel, karın çekilmeden, nefes verirken. Tartıyı da günlük değil haftalık ortalamayla değerlendir: tuz, glikojen ve su tutması günlük 1-2 kg oynatabilir.",1))}
  </main>`;
}

/* ============ İLERLEME ============ */
function chartSVG(pts){
  const W=320,H=180,padL=36,padR=10,padT=12,padB=22;
  const ys=pts.map(p=>p.kg);
  let yMin=Math.min(...ys), yMax=Math.max(...ys);
  if(yMin===yMax){ yMin-=2.5; yMax+=2.5; }
  const pad=(yMax-yMin)*0.15||1; yMin=Math.max(0,yMin-pad); yMax+=pad;
  const n=pts.length;
  const x=k=>padL+(n<=1?(W-padL-padR)/2:(k/(n-1))*(W-padL-padR));
  const y=v=>padT+(1-(v-yMin)/(yMax-yMin))*(H-padT-padB);
  const line=pts.map((p,k)=>`${k===0?"M":"L"}${x(k).toFixed(1)},${y(p.kg).toFixed(1)}`).join(" ");
  const dots=pts.map((p,k)=>`<circle cx="${x(k).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3.5" style="fill:var(--amber)"/>`).join("");
  const step=n<=8?1:Math.ceil(n/8);
  const xlabels=pts.map((p,k)=>(k%step===0||k===n-1)?`<text x="${x(k).toFixed(1)}" y="${H-6}" font-size="9" style="fill:var(--mute)" text-anchor="middle">${k+1}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
  <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" style="stroke:var(--line)"/>
  <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" style="stroke:var(--line)"/>
  <text x="${padL-4}" y="${(y(yMax)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${yMax.toFixed(1)}</text>
  <text x="${padL-4}" y="${(y(yMin)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${yMin.toFixed(1)}</text>
  <path d="${line}" fill="none" style="stroke:var(--amber)" stroke-width="2"/>
  ${dots}
  ${xlabels}
  </svg>`;
}
function progress(){
  const dayIdx = S.view.pDay ?? 0;
  const D = DAYS[dayIdx];
  const exIdx = Math.min(S.view.pEx ?? 0, D.ex.length-1);
  const E = D.ex[exIdx];
  const pts=[];
  schedule().filter(s=>s.day===dayIdx).forEach(s=>{
    const sess=S.sess[s.i]; const ed=sess&&sess.ex[E.n]; if(!ed) return;
    const kg=ed.sets[0]&&ed.sets[0].kg; if(kg===""||kg==null) return;
    const v=parseFloat(kg); if(isNaN(v)) return;
    pts.push({session:s.i+1, kg:v, reps:ed.sets[0].reps});
  });
  const mode=S.view.pMode||"ex";
  let h=`<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>İlerleme</h1><button class="ib" onclick="M.open()">☰</button></div><main>
  <div class="fld"><label>Grafik</label><select onchange="S.view.pMode=this.value;save();render()"><option value="ex" ${mode==="ex"?"selected":""}>Hareket ilerlemesi</option><option value="kg" ${mode==="kg"?"selected":""}>Vücut ağırlığı (kg)</option><option value="waist" ${mode==="waist"?"selected":""}>Bel ölçüsü (cm)</option></select></div>`;
  if(mode!=="ex") return h+`<div class="fld">${lineSVG(logPts(mode),mode==="kg"?"var(--amber)":"#4aa3df",mode==="kg"?"kg":"cm")}</div></main>`;
  h+=`
  <div class="fld"><label>Antrenman Günü</label><select onchange="setProg('day',+this.value)">${DAYS.map((dd,ix)=>`<option value="${ix}" ${ix===dayIdx?"selected":""}>${esc(dd.name)}</option>`).join("")}</select></div>
  <div class="fld"><label>Hareket</label><select onchange="setProg('ex',+this.value)">${D.ex.map((ee,ix)=>`<option value="${ix}" ${ix===exIdx?"selected":""}>${esc(ee.n)}</option>`).join("")}</select></div>`;
  if(!pts.length){
    h+=`<p class="sm">${esc(E.n)} için henüz kayıtlı set verisi yok. İlgili antrenman seansında S1 kilosunu girdikçe burada birikir.</p>`;
  } else {
    h+=`<div class="ex"><div class="num">${esc(E.n)} — S1 ağırlık (kg)</div>${chartSVG(pts)}</div>
    <table class="rt"><tr><th>#</th><th>Antrenman</th><th>S1 Kg</th><th>S1 Tekrar</th></tr>
    ${pts.map((p,k)=>`<tr><td>${k+1}</td><td>#${p.session}</td><td>${p.kg}</td><td>${esc(p.reps||"–")}</td></tr>`).join("")}
    </table>`;
  }
  return h+`</main>`;
}
function setProg(k,v){ if(k==="day"){ S.view.pDay=v; S.view.pEx=0; } else { S.view.pEx=v; } save(); render(); }

/* ============ ACTIONS ============ */
function resetSessions(){ S.sess={}; save(); go('home'); }
function lineSVG(pts,col,unit){
  if(!pts.length) return `<p class="sm">Henüz veri yok.</p>`;
  const W=320,H=150,padL=36,padR=10,padT=12,padB=22;
  const t0=new Date(pts[0].d).getTime(), t1=new Date(pts[pts.length-1].d).getTime();
  const ys=pts.map(p=>p.v); let yMin=Math.min(...ys), yMax=Math.max(...ys);
  if(yMin===yMax){yMin-=1;yMax+=1;} const pad=(yMax-yMin)*.15; yMin-=pad; yMax+=pad;
  const x=p=>padL+(t1===t0?(W-padL-padR)/2:((new Date(p.d).getTime()-t0)/(t1-t0))*(W-padL-padR));
  const y=v=>padT+(1-(v-yMin)/(yMax-yMin))*(H-padT-padB);
  const line=pts.map((p,k)=>`${k?"L":"M"}${x(p).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const dots=pts.length<=60?pts.map(p=>`<circle cx="${x(p).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" style="fill:${col}"/>`).join(""):"";
  const last=pts[pts.length-1], first=pts[0];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
  <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" style="stroke:var(--line)"/>
  <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" style="stroke:var(--line)"/>
  <text x="${padL-4}" y="${(y(yMax)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${yMax.toFixed(1)}</text>
  <text x="${padL-4}" y="${(y(yMin)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${yMin.toFixed(1)}</text>
  <text x="${padL}" y="${H-6}" font-size="9" style="fill:var(--mute)">${fmt(first.d)}</text>
  <text x="${W-padR}" y="${H-6}" font-size="9" style="fill:var(--mute)" text-anchor="end">${fmt(last.d)}</text>
  <path d="${line}" fill="none" style="stroke:${col}" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>
  <p class="sm" style="margin-top:6px">Son: <b>${last.v} ${unit}</b>${pts.length>1?` · değişim: ${(last.v-first.v>0?"+":"")+(last.v-first.v).toFixed(1)} ${unit}`:""}</p>`;
}
const logPts=f=>Object.keys(S.log||{}).filter(d=>S.log[d][f]!==""&&S.log[d][f]!=null&&!isNaN(parseFloat(S.log[d][f]))).sort().map(d=>({d,v:parseFloat(S.log[d][f])}));
function lastWeekToStart(){
  const pick={};
  for(const k of Object.keys(S.sess)){ const x=+k, d=S.sess[x]; if(!d) continue;
    const has = d.done || Object.values(d.ex||{}).some(e=>(e.sets||[]).some(st=>st.kg!==""||st.reps!==""));
    if(!has) continue; const day=x%DAYS.length; if(!(day in pick) || x>pick[day]) pick[day]=x; }
  const ns={}; for(const day of Object.keys(pick)) ns[day]=S.sess[pick[day]];
  S.sess=ns; save(); go('home'); }
function setv(i,j,k,f,v){ exData(i,j,DAYS[i%DAYS.length].ex[j]).sets[k][f]=v; keep(); render(); }
function startWorkout(i){ const s=sessData(i); s.start=Date.now(); s.durMin=null; save(); render(); }
function toggleDone(i){ const s=sessData(i); s.done=!s.done; if(s.done){ if(!s.doneDate) s.doneDate=today(); if(s.start) s.durMin=Math.round((Date.now()-s.start)/60000); } else { s.doneDate=""; s.durMin=null; } save(); go('home'); }
function resetSession(i){ delete S.sess[i]; save(); render(); }
function cfg(k,v){ S.cfg[k]=v; save(); }
function keep(){ S.view.scroll=window.scrollY; save(); }
function dl(name,txt,type){ const b=new Blob([txt],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function csvSess(){ const rows=[["Antrenman#","Hafta","Gün","Tarih","Tamamlandı","Egzersiz","Set","Kg","Tekrar/sn"]];
  for(const s of schedule()){ const d=S.sess[s.i]; if(!d) continue; DAYS[s.day].ex.forEach((E,j)=>{ const e=d.ex[E.n]; if(!e) return; e.sets.forEach((st,k)=>{ if(st.kg===""&&st.reps==="") return; rows.push([s.i+1,s.week,DAYS[s.day].name,d.doneDate||"",d.done?"evet":"hayır",E.n,k+1,st.kg,st.reps]); }); }); }
  dl("minmax-antrenman.csv","﻿"+rows.map(r=>r.join(";")).join("\n"),"text/csv"); }
function csvLog(){ const rows=[["Tarih","Kilo","Bel","Kalori","Protein","Karbonhidrat","Yağ","Antrenman","Kardiyo",...SUPS.map(x=>x[1])]];
  for(const d of Object.keys(S.log||{}).sort()){ const e=S.log[d]; rows.push([d,e.kg,e.waist,e.kcal,e.protein,e.carb,e.fat,e.antr?1:0,e.kardiyo?1:0,...SUPS.map(([k])=>e.sup&&e.sup[k]?1:0)]); }
  dl("minmax-gunluk.csv","﻿"+rows.map(r=>r.join(";")).join("\n"),"text/csv"); }
function exportJ(){ const b=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="minmax-yedek.json"; a.click(); }
function importJ(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ S=JSON.parse(r.result); ensureCfg(); save(); go('home'); }catch(e){ alert("Dosya okunamadı"); } }; r.readAsText(f); }

/* ============ TIMER ============ */
// endTime tabanlı: ekran kilitlenip setInterval durduğunda bile açılınca doğru kalan süreyi gösterir
const T={endTime:0,total:0,pausedLeft:0,iv:null,run:false,ac:null,
 start(sec,lbl){ this.total=sec; this.endTime=Date.now()+sec*1000; this.run=true; $("#tlbl").textContent=lbl||"Dinlenme"; $("#timer").classList.add("on"); $("#tm").classList.remove("fin"); $("#tpp").textContent="II"; this.tick(); clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),1000); this.ac||(this.ac=new (window.AudioContext||window.webkitAudioContext)()); },
 get left(){ return this.run ? Math.max(0,Math.round((this.endTime-Date.now())/1000)) : this.pausedLeft; },
 tick(){ const l=this.left; if(this.run&&l<=0){ this.done(); return; } const m=Math.floor(l/60), s=l%60; $("#tm").textContent=`${m}:${s<10?"0":""}${s}`; $("#tring").style.width=(this.total?l/this.total*100:0)+"%"; },
 adj(d){ if(this.run) this.endTime+=d*1000; else this.pausedLeft=Math.max(0,this.pausedLeft+d); this.total=Math.max(this.total,this.left); this.tick(); },
 toggle(){ if(this.run){ this.pausedLeft=this.left; this.run=false; } else { this.endTime=Date.now()+this.pausedLeft*1000; this.run=true; } $("#tpp").textContent=this.run?"II":"▶"; this.tick(); },
 stop(){ clearInterval(this.iv); this.run=false; $("#timer").classList.remove("on"); },
 done(){ clearInterval(this.iv); this.run=false; this.pausedLeft=0; $("#tm").classList.add("fin"); if(navigator.vibrate) navigator.vibrate([200,100,200]); this.beep(); setTimeout(()=>this.stop(),4000); },
 beep(){ try{ const ac=this.ac; [0,.25,.5].forEach(t=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.3,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.22); }); }catch(e){} }
};
// sekme/ekran tekrar görünür olunca sayacı hemen doğru değere çek (throttle edilmiş interval'ı beklemeden)
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && T.run) T.tick(); });
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
