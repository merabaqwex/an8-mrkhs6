<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111317">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Min-Max">
<title>Min-Max</title>
<style>
:root{
  --bg:#111317; --card:#1b1f26; --card2:#232830; --line:#2e343d;
  --ink:#ecebe6; --mute:#8d94a0; --amber:#f0b241; --green:#3fb66a; --red:#e0584f;
  --input:#0d0f12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:16px}
body{padding-bottom:120px}
h1,h2,h3,.disp{font-family:"Avenir Next Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
.top{position:sticky;top:0;z-index:5;background:rgba(17,19,23,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;flex:1}
.top .sub{font-size:12px;color:var(--mute);font-weight:400;display:block;font-family:-apple-system,system-ui}
.ib{background:none;border:0;color:var(--ink);font-size:22px;padding:6px 8px;border-radius:8px}
.ib:active{background:var(--card2)}
main{padding:12px 14px}
.weekh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.weekh b{color:var(--ink);font-size:14px}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--card2);color:var(--amber);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row.done{border-color:rgba(63,182,106,.6);background:linear-gradient(90deg,rgba(63,182,106,.18),var(--card) 60%)}
.row .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#0b0f0c}
.row.done .chk{background:var(--green);border-color:var(--green)}
.row .nm{flex:1}
.row .nm .t{font-size:17px;font-weight:600}
.row .nm .d{font-size:12px;color:var(--mute);margin-top:2px}
.row .nm .d .ok{color:var(--green)}
.row .arrow{color:var(--mute)}
.stat{display:flex;gap:10px;margin:4px 0 6px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-family:"Avenir Next Condensed",system-ui;font-weight:700}
.stat .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.bar{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green)}
/* session */
.banner{background:var(--card2);border-left:3px solid var(--amber);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;color:var(--ink)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.ex .num{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
select.exsel{width:100%;margin-top:4px;font-size:18px;font-weight:700;background:transparent;color:var(--ink);border:0;border-bottom:1px dashed var(--line);padding:4px 0;font-family:"Avenir Next Condensed",system-ui;appearance:none;-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;background:var(--card2);padding:4px 8px;border-radius:6px;color:var(--mute)}
.chip b{color:var(--ink);font-weight:600}
.chip.tech{color:var(--amber);border:1px solid rgba(240,178,65,.4);background:transparent}
.hint{font-size:13px;margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--input);border:1px solid var(--line)}
.hint .k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.hint.s{border-color:rgba(240,178,65,.45)}
.hint.s .v{color:var(--amber);font-weight:700;font-size:16px}
.wu{display:flex;gap:6px;flex-wrap:wrap}
.wu span{background:var(--card2);padding:4px 8px;border-radius:6px;font-size:13px}
.wu span b{color:var(--amber)}
.sets{margin-top:8px}
.set{display:grid;grid-template-columns:52px 1fr 1fr 48px;gap:8px;align-items:center;margin-bottom:8px}
.set .lab{font-size:12px;color:var(--mute)}
.set .lab b{display:block;color:var(--ink);font-size:14px}
input[type=number],input[type=date],input[type=text]{width:100%;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 8px;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--amber)}
.set .rir{font-size:12px;color:var(--mute);text-align:center}
.set .rir b{display:block;color:var(--ink);font-size:15px}
.exfoot{display:flex;gap:8px;margin-top:6px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);background:var(--card2)}
.btn.am{background:var(--amber);color:#1a1200}
.btn.gr{background:var(--green);color:#06150b}
.btn.rd{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:active{filter:brightness(.85)}
.btn.full{width:100%;padding:14px;font-size:17px}
details summary{color:var(--mute);font-size:13px;cursor:pointer;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details p{font-size:13px;margin:4px 0 0;color:var(--ink);line-height:1.4}
.donebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.donebox.on{border-color:var(--green)}
.donebox label{font-size:12px;color:var(--mute);display:block;margin-bottom:6px}
/* timer */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#0b0d10;border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:none;align-items:center;gap:10px}
#timer.on{display:flex}
#timer .tm{font-family:"Avenir Next Condensed",system-ui;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px;line-height:1}
#timer .tm.fin{color:var(--green)}
#timer .lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#timer .ring{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
#timer .ring i{display:block;height:100%;background:var(--amber);width:100%}
#timer .ctl{display:flex;gap:6px}
#timer .ctl button{background:var(--card2);color:var(--ink);border:0;border-radius:8px;width:44px;height:40px;font-size:15px;font-weight:600}
/* settings */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.fld input{text-align:left}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:14px}
.days button.on{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700}
.sm{font-size:12px;color:var(--mute);line-height:1.4}
.hid{display:none}
.cbs{display:flex;flex-direction:column;gap:8px}
.cb{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.cb.on{border-color:var(--green)}
.cb .sq{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#06150b;font-weight:700;flex-shrink:0}
.cb.on .sq{background:var(--green);border-color:var(--green)}
.mrow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px}
.mrow .l{color:var(--ink)}
.mrow .v{color:var(--mute)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid div span{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt th{text-align:left;color:var(--mute);font-weight:600;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
table.rt td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.rt tr:last-child td{border-bottom:0}
/* menu */
#menu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none}
#menu.on{display:block}
#menu .panel{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:14px;left:14px;max-width:280px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#menu .item{padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#menu .item:last-child{border-bottom:0}
#menu .item:active{background:var(--card2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer">
  <div><div class="lbl" id="tlbl">Dinlenme</div><div class="tm" id="tm">0:00</div></div>
  <div class="ring"><i id="tring"></i></div>
  <div class="ctl">
    <button onclick="T.adj(-15)">−15</button>
    <button onclick="T.adj(15)">+15</button>
    <button onclick="T.toggle()" id="tpp">II</button>
    <button onclick="T.stop()">✕</button>
  </div>
</div>
<div id="menu" onclick="if(event.target===this) M.close()">
  <div class="panel">
    <div class="item" onclick="M.go('home')">🏠 Antrenmanlar</div>
    <div class="item" onclick="M.go('log')">📋 Günlük</div>
    <div class="item" onclick="M.go('progress')">📈 İlerleme</div>
    <div class="item" onclick="M.go('rules')">ⓘ Kurallar</div>
    <div class="item" onclick="M.go('set')">⚙︎ Ayarlar</div>
  </div>
</div>
<script>
/* ============ PROGRAM ============ */
// warm: Jeff's warm-up set range string; sets; range [lo,hi] or null(time); rirI=intro/deload weeks, rirN=normal; tech=block2 technique; rest seconds; type c=compound i=isolation
const DAYS = [
 {name:"Torso A", ex:[
  {n:"Incline DB Y-Raise",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"30° bench'e sırtını yasla, ağırlığı Y şeklinde yukarı-dışa kaldır."},
  {n:"Cable Crunch",a:[],warm:"0-1",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Crunch yaparken belini yuvarla, karınla zihin-kas bağlantısı."},
  {n:"Smith Machine Behind-the-Neck Press",a:[],warm:"1-2",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:180,t:"c",note:"Dik bench, bar kafanın arkasından kulak/ense hizasına kadar iner (daha aşağı inme). Omuz mobilitesi gerekir, ağrı/sıkışma hissedersen bırak ve yerine ön press yap. Kiloyu normal ön press kilosundan belirgin düşük tut, failure için Smith emniyet pimlerini ayarla."},
  {n:"Chest-Supported DB Row",a:[],warm:"1-2",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:"2 Drop Set (~%25)",rest:150,t:"c",note:"Dirsekleri ~45° aç, üstte kürek kemiklerini sert sık."},
  {n:"Reverse Cable Crossover",a:[],warm:"0-1",sets:1,r:[8,10],rirI:[0],rirN:[0],tech:null,rest:90,t:"i",note:"Kabloları çaprazla (sağ el sol tarafa, sol el sağ tarafa), dirsekler hafif kilitli, arka deltoidi sıkarak dışa-geriye çek."},
  {n:"DB Incline Press",a:[],warm:"2-4",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:240,t:"c",note:"30–45° bench. Altta 1 sn dur, pec gerginliğini koru. RIR 0 = son tekrarı denemeden bırak."},
  {n:"Lat Pulldown (Wide Grip)",a:[],warm:"1-2",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:"Lengthened Partials",rest:150,t:"c",note:"Negatifi kontrol et, latlerin açıldığını hisset. Tam ROM!"},
 ]},
 {name:"Limbs A", ex:[
  {n:"Bayesian Cable Curl",a:[],warm:"0-1",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Alçak makara, makaraya sırtını dön, bir adım öne çık; kol gövdenin arkasında başlar (long head'de derin esneme), kablo sayesinde tüm ROM boyunca gerginlik kesilmez."},
  {n:"Cable Wrist Curl",a:[],warm:"0-1",sets:1,r:[8,10],rirI:[0],rirN:[0],tech:null,rest:90,t:"i",note:"Akıcı, kontrollü tekrarlar."},
  {n:"Overhead Cable Triceps Ext.",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Negatif boyunca triceps'te derin esneme."},
  {n:"Cable Wrist Extension",a:[],warm:"0-1",sets:1,r:[8,10],rirI:[0],rirN:[0],tech:null,rest:90,t:"i",note:"Akıcı, kontrollü tekrarlar."},
  {n:"Standing Calf Raise",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:"Lengthened Partials",rest:90,t:"i",note:"Altta 1-2 sn dur, bileği ileri-geri yuvarla."},
  {n:"Bulgarian Split Squat",a:[],warm:"1-2",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:180,t:"c",note:"Arka ayak bench'te, DB veya Smith ile. 1 set = sağ + sol bacak (zayıf bacakla başla, kilo/tekrar her iki bacakta aynı). Quad vurgusu için gövdeyi dik tut ve ön ayağı bench'e çok uzak koyma; gövdeyi öne eğersen kalçaya kayar. Failure'a gideceksen Smith daha güvenli. Kg kutusuna hep aynı şekilde yaz (tek DB ya da bar yükü)."},
  {n:"Smith Machine Romanian Deadlift",a:[],warm:"1-2",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:150,t:"c",note:"Ayaklar barın hafif önünde, kalçayı geriye it, bar bacağa yakın iner. Omurga nötr, altta hamstringde derin esneme."},
  {n:"Smith Machine Hip Thrust",a:[],warm:"1-2",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:150,t:"c",note:"Sırtını bench'e yasla, Smith barını (pedle) kalça kıvrımına oturt. Üstte kalçayı sert sık, inişi kontrol et."},
 ]},
 {name:"Torso B", ex:[
  {n:"High-Cable Lateral Raise",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Kablo kalça hizasında. Altta elini orta hattı hafif geçir, derin esneme."},
  {n:"Straight-Arm Pulldown",a:[],warm:"0-1",sets:2,r:[10,12],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Hafif öne eğil, dirsekleri kırmadan kafa üstünden kalçaya doğru yay çiz. Lat'lerde derin gerilme hisset."},
  {n:"Cable Fly",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Hafif öne eğil, kabloları göğüs hizasında birleştir, altta derin esneme hisset."},
  {n:"Face Pull",a:[],warm:"0-1",sets:1,r:[10,12],rirI:[0],rirN:[0],tech:null,rest:90,t:"i",note:"İp/çift tutamaç kullan, yüz hizasına doğru çek, dirsekleri yüksek tut, üstte arka delt ve rotator cuff'ı sık."},
  {n:"Smith Machine Shrug",a:[],warm:"1-2",sets:1,r:[6,8],rirI:[0],rirN:[0],tech:null,rest:90,t:"i",note:"Kulaklara doğru omuz silk. Mümkünse strap."},
  {n:"Cable Crunch",a:[],warm:"0-1",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Crunch yaparken belini yuvarla, karınla zihin-kas bağlantısı."},
  {n:"Machine Chest Press",a:[],warm:"2-4",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:"Static Hold 30 sn",rest:240,t:"c",note:"Altta 1 sn dur, pec gerginliğini koru."},
  {n:"1-Arm Cable Row",a:[],warm:"1-2",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:150,t:"c",note:"Tek kolla çek, gövdeyi sabit tut, üstte kürek kemiğini sık. Sağ-sol dengesizliğini takip et."},
  {n:"Seated Smith Machine Shoulder Press",a:[],warm:"1-2",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:null,rest:240,t:"c",note:"Sırtın dik, dirsekler en az 90° kırılsın. Smith'in sabit yörüngesi güvenli overload sağlar, tam kilitlemeden kontrollü indir."},
 ]},
 {name:"Limbs B", ex:[
  {n:"Preacher Curl",a:[],warm:"0-1",sets:2,r:[6,8],rirI:[0,0],rirN:[0,0],tech:"2 Drop Set (~%25)",rest:90,t:"i",note:"Preacher (scott) sehpasına yasla, supine (avuç yukarı) tutuş, kontrollü tekrar. Sehpa sayesinde drop set'te de form bozulmaz."},
  {n:"Cable Triceps Kickback",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:"2 Drop Set (~%25)",rest:90,t:"i",note:"Üst kol tüm ROM boyunca gövdenin arkasında."},
  {n:"Preacher Hammer Curl",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Preacher (scott) sehpasına yasla, nötr (şakül) tutuş. Sehpa omuz yardımını keser, brakiyalis/ön kol dış kısmı izole olur."},
  {n:"Triceps Pressdown",a:[],warm:"0-1",sets:2,r:[8,10],rirI:[0,0],rirN:[0,0],tech:null,rest:90,t:"i",note:"Dirsekleri sabit tut, sadece ön koldan hareket et."},
  {n:"Leg Extension",a:[],warm:"1-2",sets:3,r:[8,10],rirI:[0,0,0],rirN:[0,0,0],tech:"Lengthened Partials",rest:90,t:"i",note:"Koltuğu geriye al, tutamakları kavrayıp kalçanı koltuğa bastır."},
  {n:"Lying Leg Curl",a:[],warm:"1-2",sets:3,r:[6,8],rirI:[0,0,0],rirN:[0,0,0],tech:"Lengthened Partials",rest:90,t:"i",note:"Makineyi altta en büyük esnemeyi alacak şekilde ayarla. Kalçanın kalkmasına izin verme."},
  {n:"Glute Kickback",a:[],warm:"0-1",sets:1,r:[10,12],rirI:[0],rirN:[0],tech:null,rest:90,t:"i",note:"Üstte 1 sn sık, belini yuvarlamadan sadece kalçadan it."},
 ]},
];
// warm-up set count as Baran decided
const WCOUNT = {"0-1":1,"1-2":1,"2-3":1,"2-4":1,"3-4":1};
// Jeff's percentage/rep table
const WTABLE = {
 1:[[60,"6-10"]],
 2:[[50,"6-10"],[70,"4-6"]],
 3:[[45,"6-10"],[65,"4-6"],[85,"3-4"]],
 4:[[45,"6-10"],[60,"4-6"],[75,"3-5"],[85,"2-4"]],
};
const TECH_EXPL = {
 "Lengthened Partials":"Tam ROM ile başarısız olunca esneme pozisyonunda kısmi tekrarlarla devam et.",
 "2 Drop Set (~%25)":"Başarısız olunca ağırlığı ~%25 düşür, tekrar başarısızlığa git; bir kez daha tekrarla.",
 "Myo-reps":"Başarısız olunca 5 sn dinlen + 2 tekrar; 2 tam tekrar yapamayana kadar döngüyü sürdür.",
 "Static Hold 30 sn":"Başarısız olunca alt (esneme) pozisyonu tam gerginlikle 30 sn tut.",
};

/* ============ STATE ============ */
const KEY="minmax_v1";
const iso = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = ()=>iso(new Date());
function defaultTargets(){ return {train:{kcal:2550,protein:170,carb:300,fat:75},rest:{kcal:2435,protein:170,carb:270,fat:75}}; }
function ensureCfg(){
  S.cfg = S.cfg || {};
  if(S.cfg.weeks==null) S.cfg.weeks=20;
  if(S.cfg.incC==null) S.cfg.incC=5;
  if(S.cfg.incI==null) S.cfg.incI=2.5;
  if(S.cfg.round==null) S.cfg.round=2.5;
  if(!S.cfg.targets) S.cfg.targets=defaultTargets();
  if(!S.cfg.targets.train) S.cfg.targets.train=defaultTargets().train;
  if(!S.cfg.targets.rest) S.cfg.targets.rest=defaultTargets().rest;
}
let S = load();
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return {cfg:{weeks:20,incC:5,incI:2.5,round:2.5,targets:defaultTargets()},sess:{},view:{page:"home"}};
}

function save(){ const j=JSON.stringify(S); try{localStorage.setItem(KEY,j);}catch(e){} if(window.__onSave){ const f=window.__onSave; window.__onSave=null; f(j); } }

function schedule(){
  const n=Math.max(4,(S.cfg.weeks||20)*4), out=[];
  for(let i=0;i<n;i++) out.push({i, day:i%4, week:Math.floor(i/4)+1, pw:Math.floor(i/4)%12+1});
  return out;
}
const LAYOUT=`Torso ve Limbs günleri birbiriyle ortak kas paylaşmıyor (Torso: göğüs/sırt/omuz/karın, Limbs: bacak/kol/calf), art arda günlerde de yapılabilir.
Önerilen hafta (4 gün): Pzt Torso A · Sal Limbs A · Çar dinlen · Per Torso B · Cum Limbs B · Cmt-Paz dinlen.
Alternatif: Pzt Torso A · Çar Limbs A · Per Torso B · Cmt Limbs B.
3 günlük haftalarda sırayı bozmadan devam et, kalan antrenman sonraki haftaya kayar.`;
const fmt = s=>{ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short",weekday:"short"}); };
const isLight = w => w===1||w===7;
const sessData = i => S.sess[i] || (S.sess[i]={done:false,doneDate:"",ex:{}});
const exData = (i,j,E) => { const s=sessData(i); const d=s.ex[E.n]||(s.ex[E.n]={sets:[]}); while(d.sets.length<E.sets) d.sets.push({kg:"",reps:""}); return d; };
const roundTo = (x,q)=>Math.round(x/q)*q;

// suggestion: look back for same slot + same set index, independent per set
function suggest(i,j,k,E){
  if(!E.r) return null;
  const sched = schedule();
  for(let x=i-1;x>=0;x--){
    const sx=sched[x]; if(!sx || sx.day!==i%4) continue;
    const d=S.sess[x]&&S.sess[x].ex[E.n]; if(!d) continue;
    const st=d.sets[k]; if(!st||st.kg===""||st.reps==="") continue;
    const kg=parseFloat(st.kg); if(isNaN(kg)) continue;
    const reps=parseFloat(st.reps); if(isNaN(reps)) continue;
    const inc = E.t==="c"?S.cfg.incC:S.cfg.incI;
    if(reps>=E.r[1]) return {kg:kg+inc, why:`Geçen seans ${reps} tekrar – üst sınıra ulaştın, +${inc} kg`, prev:kg, prevReps:reps};
    return {kg, why:`Geçen seans ${kg} kg × ${reps} – aynı kiloyla ${E.r[1]} tekrarı hedefle`, prev:kg, prevReps:reps};
  }
  return null;
}
function warmup(E,work){
  const n=WCOUNT[E.warm]||1; if(!work||!E.r) return {n,list:[]};
  return {n,list:WTABLE[n].map(([p,reps])=>({kg:roundTo(work*p/100,S.cfg.round),p,reps}))};
}
// macro % → renk (kcal simetrik bant, protein/karb/yağ taban odaklı)
function macroColor(key,pctv){
  if(pctv==null) return "var(--mute)";
  if(key==="kcal"){
    if(pctv>=90&&pctv<=110) return "var(--green)";
    if((pctv>=70&&pctv<90)||(pctv>110&&pctv<=130)) return "var(--amber)";
    return "var(--red)";
  }
  if(pctv>=90) return "var(--green)";
  if(pctv>=70) return "var(--amber)";
  return "var(--red)";
}

function home(){

  }

function session(i){
  const s=schedule()[i]; if(!s){S.view.page="home";return home();}
  const D=DAYS[s.day], sd=sessData(i), light=isLight(s.pw), b2=s.pw>=8;
  let h=`<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>${esc(D.name)}<span class="sub">#${i+1} · Hafta ${s.week}${sd.durMin!=null?` · ${sd.durMin} dk sürdü`:""}</span></h1><button class="ib" onclick="M.open()">☰</button></div><main>`;
  h+=`<div class="hint" style="margin-bottom:10px">${sd.start?`<span class="k">Başlangıç</span>${new Date(sd.start).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}<button class="btn" style="margin-left:10px;padding:4px 10px;font-size:12px" onclick="startWorkout(${i})">Yeniden başlat</button>`:`<button class="btn full" onclick="startWorkout(${i})">▶ Antrenmana Başla</button>`}</div>`;
  if(light) h+=`<div class="banner">${s.pw===1?"Intro":"Deload"} haftası: Kiloyu zorlama. Kilo önerisi bu hafta bir önceki seansla aynı tutulur.</div>`;
  if(b2) h+=`<div class="banner">Blok 2: amber etiketli egzersizlerde yoğunluk tekniği sadece <b>son çalışma setinden sonra</b> uygulanır.</div>`;
  D.ex.forEach((E,j)=>{
    const d=exData(i,j,E);
    const rir=light?E.rirI:E.rirN;
    const sugs = d.sets.map((st,k)=>suggest(i,j,k,E));
    const sug0 = sugs[0];
    const sugKg0 = sug0 ? (light?sug0.prev:sug0.kg) : null;
    const work = d.sets[0].kg!==""?parseFloat(d.sets[0].kg):sugKg0;
    const wu=warmup(E,work);
    h+=`<div class="ex"><div class="num">Egzersiz ${j+1}</div><h2 style="font-size:20px;margin:2px 0 4px">${esc(E.n)}</h2>
    <div class="chips"><span class="chip">Isınma <b>${wu.n} set</b></span><span class="chip">Çalışma <b>${E.sets} set</b></span><span class="chip">Tekrar <b>${E.r?E.r.join("–"):"süre"}</b></span><span class="chip">Dinlenme <b>${E.rest/60} dk</b></span>${b2&&E.tech?`<span class="chip tech">${esc(E.tech)}</span>`:""}</div>`;
    if(E.r && sugs.some(sg=>sg)) h+=`<div class="hint s"><span class="k">Öneri${light?" (hafif hafta)":""} — set başına</span>${sugs.map((sg,k)=>{
      if(!sg) return `<div style="margin-top:4px;font-size:13px">Set ${k+1}: <span style="color:var(--mute)">ilk seans</span></div>`;
      const sk=light?sg.prev:sg.kg;
      return `<div style="margin-top:4px;font-size:13px">Set ${k+1}: <b style="color:var(--amber)">${sk} kg</b> <span style="color:var(--mute)">· ${esc(light?`geçen ${sg.prev} kg × ${sg.prevReps}`:sg.why)}</span></div>`;
    }).join("")}</div>`;
    else if(E.r) h+=`<div class="hint"><span class="k">Öneri</span>İlk seans – kiloyu kendin belirle, sonraki seansta öneri çıkar.</div>`;
    if(wu.list.length) h+=`<div class="hint"><span class="k">Isınma (${work} kg üzerinden)</span><div class="wu">${wu.list.map((w,k)=>`<span>${k+1}: <b>${w.kg} kg</b> × ${w.reps}</span>`).join("")}</div></div>`;
    else if(E.r) h+=`<div class="hint"><span class="k">Isınma</span>${wu.n} set – S1 kilosunu girince hesaplanır.</div>`;
    h+=`<div class="sets">`;
    d.sets.forEach((st,k)=>{
      const sg=sugs[k]; const sk=sg?(light?sg.prev:sg.kg):null;
      h+=`<div class="set"><div class="lab">Set<b>${k+1}</b></div><input type="number" inputmode="decimal" step="0.5" placeholder="${E.r?(sk??"kg"):"—"}" value="${esc(st.kg)}" onchange="setv(${i},${j},${k},'kg',this.value)">
      <input type="number" inputmode="numeric" placeholder="${E.r?"tekrar":"sn"}" value="${esc(st.reps)}" onchange="setv(${i},${j},${k},'reps',this.value)"><div class="rir">RIR<b>${rir[k]??"–"}</b></div></div>`;
    });
    h+=`</div><div class="exfoot"><button class="btn am" onclick="T.start(${E.rest},'${esc(E.n)}')">▶ Dinlen ${E.rest/60} dk</button><button class="btn" onclick="T.start(60,'${esc(E.n)}')">1 dk</button></div>
    <details><summary>Not ${b2&&E.tech?"· teknik":""}</summary><p>${esc(E.note)}</p>${b2&&E.tech?`<p style="color:var(--amber)">${esc(E.tech)}: ${esc(TECH_EXPL[E.tech]||"")}</p>`:""}</details></div>`;
  });
  h+=`<div class="donebox ${sd.done?"on":""}"><label>Antrenman tarihi (sen gir)</label><input type="date" value="${esc(sd.doneDate||"")}" onchange="sessData(${i}).doneDate=this.value;save()">
  <div style="height:10px"></div><button class="btn full ${sd.done?"":"gr"}" onclick="toggleDone(${i})">${sd.done?"Tamamlandı ✓ (geri al)":"Antrenmanı tamamla"}</button></div></main>`;
  return h;
}

function logent(d){ S.log=S.log||{}; return S.log[d]||(S.log[d]={kg:"",waist:"",kcal:"",protein:"",carb:"",fat:"",antr:false,kardiyo:false,sup:{}}); }

  return `<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>Kurallar</h1><button class="ib" onclick="M.open()">☰</button></div><main>

  <div class="weekh"><span><b>Strateji — Skinny Fat / Recomp</b></span></div>
  <div class="ex">
  <p style="margin:0 0 8px">Düşük kas kütlesi + yüksek karın yağı kombinasyonu. Çözüm ne agresif bulk ne agresif cut — <b>recomp</b>: küçük kalori açığı + yüksek protein + progresif ağırlık antrenmanı, aynı anda.</p>
  <p style="margin:0">Bu faz (Faz 1) genelde <b>3-5 ay</b> sürer. Aceleye getirme, sadece aylık değerlendirmeyle ilerlet.</p>
  </div>

  <div class="weekh"><span><b>Kalori & Makro Mantığı</b></span></div>
  <div class="ex">
  <p style="margin:0 0 6px"><b>Antrenman günü:</b> karbonhidrat daha yüksek — glikojen antrenman performansını doğrudan besler.</p>
  <p style="margin:0 0 6px"><b>Dinlenme günü:</b> karbonhidrat ~%20 daha düşük — o gün ekstra yakıta ihtiyaç yok, fazlası yağ olarak birikir.</p>
  <p style="margin:0">Protein ve yağ her gün sabit kalır, sadece karbonhidrat oynar. Hedefleri Ayarlar sayfasından değiştirebilirsin.</p>
  </div>

  <div class="weekh"><span><b>Bel Ölçümü</b></span></div>
  <div class="ex">
  <p style="margin:0 0 6px">En kalın noktadan ölç — göbek deliği zorunlu değil. Senin için alt karın bölgesiyse orası referans noktan.</p>
  <p style="margin:0 0 6px">Kritik kural: <b>her zaman aynı noktadan</b> ölç. İlk ölçtüğünde o noktayı not al ve her ay oradan ölç.</p>
  <p style="margin:0">Sabah aç karnına, ayakta, mezura yere paralel, karın çekilmeden — ayda 1 kez yeterli, daha sık ölçüm su tutmasından yanıltır.</p>
  </div>

  <div class="weekh"><span><b>Değerlendirme Kuralları</b></span></div>
  <div class="ex">
  <p style="margin:0 0 8px">Ayda 1-2 kez değerlendir. Tek haftaya göre karar verme — trend en az 2-3 hafta aynı yöne gitmeli.</p>
  <table class="rt">
   <tr><th>Haftalık trend</th><th>Anlamı</th><th>Aksiyon</th></tr>
   <tr><td>Tartı & bel sabit</td><td>Açık yok</td><td>−100/−150 kcal</td></tr>
   <tr><td>0,2-0,4 kg/hafta düşüş</td><td>Hedef bölge</td><td>Dokunma</td></tr>
   <tr><td>0,5+ kg/hafta düşüş</td><td>Açık çok derin</td><td>+100/+200 kcal</td></tr>
   <tr><td>Tartı yükseliyor</td><td>Fazla kalori</td><td>−100/−200 kcal</td></tr>
  </table>
  <p style="margin:8px 0 0">Ayarlama karbonhidrattan yapılır, protein asla kısılmaz.</p>
  </div>

  <div class="weekh"><span><b>Faz 2'ye Geçiş</b></span></div>
  <div class="ex">
  <p style="margin:0 0 6px">Hedef nokta sabit: <b>~%15 civarı</b> (düşük-orta yağ sınırı) — başlangıç yüzden %20, %25 veya %30 olsun fark etmez, oransal bir düşüş değil. Nereden başlarsan başla varış noktası aynı, sadece yol uzunluğu değişir.</p>
  <p style="margin:0 0 6px">Başlangıcın <b>%25'in üzerindeyse</b>, kitap daha büyük bir açık öneriyor: standart %10-20 yerine <b>%20-30</b>. Yakılacak yağ deposu fazla olduğu için kas kaybı riski düşükken süreci hızlandırabilirsin — Ayarlar'dan kalori hedeflerini buna göre biraz daha kısabilirsin.</p>
  <p style="margin:0">Kesin ölçüm (kaliper/BIA/DEXA) yoksa yüzdeyi izlemeye çalışma — bel çevresi ilk ölçümden <b>4-6 cm+</b> düşmüş, karın hafif seçilmeye başlamış ve fotoğrafta net fark varsa, o bölgeye gelmişsindir demektir. Üçü birlikte gerçekleştiğinde geç. O noktada kalori bakıma çıkar, karbonhidrat oranı yükselir — hedefleri yeniden hesaplat.</p>
  </div>

  <div class="weekh"><span><b>Diğer Kritik Noktalar</b></span></div>
  <div class="ex">
  <p style="margin:0 0 6px"><b>Uyku:</b> 7,5-8 saat hedefle. Uyku kısıldığında kaybedilen kilonun büyük kısmı yağ değil, kastan gider.</p>
  <p style="margin:0 0 6px"><b>Kardiyo:</b> futbol zaten sayılıyor, ekstra haftada 1-2× 30 dk düşük tempo yeterli. HIIT'e gerek yok.</p>
  <p style="margin:0">Tartı günlük değil <b>haftalık ortalama</b> ile değerlendirilir — tuz, glikojen, su tutması günlük 1-2 kg oynatabilir, tek günü yorumlama.</p>
  </div>
  </main>`;
}

/* ============ İLERLEME ============ */
function chartSVG(pts){
  const W=320,H=180,padL=36,padR=10,padT=12,padB=22;
  const ys=pts.map(p=>p.kg);
  let yMin=Math.min(...ys), yMax=Math.max(...ys);
  if(yMin===yMax){ yMin-=2.5; yMax+=2.5; }
  const pad=(yMax-yMin)*0.15||1; yMin=Math.max(0,yMin-pad); yMax+=pad;
  const n=pts.length;
  const x=k=>padL+(n<=1?(W-padL-padR)/2:(k/(n-1))*(W-padL-padR));
  const y=v=>padT+(1-(v-yMin)/(yMax-yMin))*(H-padT-padB);
  const line=pts.map((p,k)=>`${k===0?"M":"L"}${x(k).toFixed(1)},${y(p.kg).toFixed(1)}`).join(" ");
  const dots=pts.map((p,k)=>`<circle cx="${x(k).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3.5" style="fill:var(--amber)"/>`).join("");
  const step=n<=8?1:Math.ceil(n/8);
  const xlabels=pts.map((p,k)=>(k%step===0||k===n-1)?`<text x="${x(k).toFixed(1)}" y="${H-6}" font-size="9" style="fill:var(--mute)" text-anchor="middle">${k+1}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
  <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" style="stroke:var(--line)"/>
  <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" style="stroke:var(--line)"/>
  <text x="${padL-4}" y="${(y(yMax)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${yMax.toFixed(1)}</text>
  <text x="${padL-4}" y="${(y(yMin)+3).toFixed(1)}" font-size="9" style="fill:var(--mute)" text-anchor="end">${yMin.toFixed(1)}</text>
  <path d="${line}" fill="none" style="stroke:var(--amber)" stroke-width="2"/>
  ${dots}
  ${xlabels}
  </svg>`;
}
function progress(){
  const dayIdx = S.view.pDay ?? 0;
  const D = DAYS[dayIdx];
  const exIdx = Math.min(S.view.pEx ?? 0, D.ex.length-1);
  const E = D.ex[exIdx];
  const pts=[];
  schedule().filter(s=>s.day===dayIdx).forEach(s=>{
    const sess=S.sess[s.i]; const ed=sess&&sess.ex[E.n]; if(!ed) return;
    const kg=ed.sets[0]&&ed.sets[0].kg; if(kg===""||kg==null) return;
    const v=parseFloat(kg); if(isNaN(v)) return;
    pts.push({session:s.i+1, kg:v, reps:ed.sets[0].reps});
  });
  let h=`<div class="top"><button class="ib" onclick="go('home')">‹</button><h1>İlerleme</h1><button class="ib" onclick="M.open()">☰</button></div><main>
  <div class="fld"><label>Antrenman Günü</label><select onchange="setProg('day',+this.value)">${DAYS.map((dd,ix)=>`<option value="${ix}" ${ix===dayIdx?"selected":""}>${esc(dd.name)}</option>`).join("")}</select></div>
  <div class="fld"><label>Hareket</label><select onchange="setProg('ex',+this.value)">${D.ex.map((ee,ix)=>`<option value="${ix}" ${ix===exIdx?"selected":""}>${esc(ee.n)}</option>`).join("")}</select></div>`;
  if(!pts.length){
    h+=`<p class="sm">${esc(E.n)} için henüz kayıtlı set verisi yok. İlgili antrenman seansında S1 kilosunu girdikçe burada birikir.</p>`;
  } else {
    h+=`<div class="ex"><div class="num">${esc(E.n)} — S1 ağırlık (kg)</div>${chartSVG(pts)}</div>
    <table class="rt"><tr><th>#</th><th>Antrenman</th><th>S1 Kg</th><th>S1 Tekrar</th></tr>
    ${pts.map((p,k)=>`<tr><td>${k+1}</td><td>#${p.session}</td><td>${p.kg}</td><td>${esc(p.reps||"–")}</td></tr>`).join("")}
    </table>`;
  }
  return h+`</main>`;
}
function setProg(k,v){ if(k==="day"){ S.view.pDay=v; S.view.pEx=0; } else { S.view.pEx=v; } save(); render(); }

/* ============ ACTIONS ============ */
function resetSessions(){ S.sess={}; save(); go('home'); }
function setv(i,j,k,f,v){ exData(i,j,DAYS[i%4].ex[j]).sets[k][f]=v; keep(); render(); }
function startWorkout(i){ const s=sessData(i); s.start=Date.now(); s.durMin=null; save(); render(); }
function toggleDone(i){ const s=sessData(i); s.done=!s.done; if(s.done){ if(!s.doneDate) s.doneDate=today(); if(s.start) s.durMin=Math.round((Date.now()-s.start)/60000); } save(); go('home'); }
function cfg(k,v){ S.cfg[k]=v; save(); }
function cfgT(day,key,v){ S.cfg.targets[day][key]=v; save(); }
function keep(){ S.view.scroll=window.scrollY; save(); }
function dl(name,txt,type){ const b=new Blob([txt],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function csvSess(){ const rows=[["Antrenman#","Hafta","Gün","Tarih","Tamamlandı","Egzersiz","Set","Kg","Tekrar/sn"]];
  for(const s of schedule()){ const d=S.sess[s.i]; if(!d) continue; DAYS[s.day].ex.forEach((E,j)=>{ const e=d.ex[E.n]; if(!e) return; e.sets.forEach((st,k)=>{ if(st.kg===""&&st.reps==="") return; rows.push([s.i+1,s.week,DAYS[s.day].name,d.doneDate||"",d.done?"evet":"hayır",E.n,k+1,st.kg,st.reps]); }); }); }
  dl("minmax-antrenman.csv","\ufeff"+rows.map(r=>r.join(";")).join("\n"),"text/csv"); }
function csvLog(){ const rows=[["Tarih","Kilo","Bel","Kalori","Protein","Karbonhidrat","Yağ","Antrenman","Kardiyo",...SUPS.map(x=>x[1])]];
  for(const d of Object.keys(S.log||{}).sort()){ const e=S.log[d]; rows.push([d,e.kg,e.waist,e.kcal,e.protein,e.carb,e.fat,e.antr?1:0,e.kardiyo?1:0,...SUPS.map(([k])=>e.sup&&e.sup[k]?1:0)]); }
  dl("minmax-gunluk.csv","\ufeff"+rows.map(r=>r.join(";")).join("\n"),"text/csv"); }
function exportJ(){ const b=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="minmax-yedek.json"; a.click(); }
function importJ(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ S=JSON.parse(r.result); ensureCfg(); save(); go('home'); }catch(e){ alert("Dosya okunamadı"); } }; r.readAsText(f); }

/* ============ TIMER ============ */
// endTime tabanlı: ekran kilitlenip setInterval durduğunda bile açılınca doğru kalan süreyi gösterir
const T={endTime:0,total:0,pausedLeft:0,iv:null,run:false,ac:null,
 start(sec,lbl){ this.total=sec; this.endTime=Date.now()+sec*1000; this.run=true; $("#tlbl").textContent=lbl||"Dinlenme"; $("#timer").classList.add("on"); $("#tm").classList.remove("fin"); $("#tpp").textContent="II"; this.tick(); clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),1000); this.ac||(this.ac=new (window.AudioContext||window.webkitAudioContext)()); },
 get left(){ return this.run ? Math.max(0,Math.round((this.endTime-Date.now())/1000)) : this.pausedLeft; },
 tick(){ const l=this.left; if(this.run&&l<=0){ this.done(); return; } const m=Math.floor(l/60), s=l%60; $("#tm").textContent=`${m}:${s<10?"0":""}${s}`; $("#tring").style.width=(this.total?l/this.total*100:0)+"%"; },
 adj(d){ if(this.run) this.endTime+=d*1000; else this.pausedLeft=Math.max(0,this.pausedLeft+d); this.total=Math.max(this.total,this.left); this.tick(); },
 toggle(){ if(this.run){ this.pausedLeft=this.left; this.run=false; } else { this.endTime=Date.now()+this.pausedLeft*1000; this.run=true; } $("#tpp").textContent=this.run?"II":"▶"; this.tick(); },
 stop(){ clearInterval(this.iv); this.run=false; $("#timer").classList.remove("on"); },
 done(){ clearInterval(this.iv); this.run=false; this.pausedLeft=0; $("#tm").classList.add("fin"); if(navigator.vibrate) navigator.vibrate([200,100,200]); this.beep(); setTimeout(()=>this.stop(),4000); },
 beep(){ try{ const ac=this.ac; [0,.25,.5].forEach(t=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.3,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.22); }); }catch(e){} }
};
// sekme/ekran tekrar görünür olunca sayacı hemen doğru değere çek (throttle edilmiş interval'ı beklemeden)
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && T.run) T.tick(); });
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
